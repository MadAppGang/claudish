description: "the same context-reduction comparison with claudish between Claude Code and the Anthropic API"
bench: ./madbench.yaml

# Every variant starts claudish, not claude, through ./bin/claudish-unattended,
# which runs the first claudish on PATH with --quiet -y so that no question
# ("Update now?", "Enable auto-approve?") stops it before Claude Code starts.
# Put the build under test first on PATH. The model is the bare Claude name, so
# claudish runs a normal session on the Claude subscription and loads its
# hooks. A `claude@` model would be a monitor session, which loads none.
#
# The variants differ only in the composed files, the one staged plugin and
# the second provision step, which copies the variant's claudish config into
# the run's ~/.claudish.
guard_changes:
  allow:
    - harness/config/files/**
    - harness/config/plugins/**
    - sandbox/provision/steps/1
    # The gateway executable (the gateway_bin share), which only the streamfix
    # variant changes.
    - sandbox/share/paths/6/from
    - sandbox/share/paths/6/identity
    # The claudish build and config (claudish_build, claudish_config), which
    # only claudish-compaction changes.
    - sandbox/share/paths/7/from
    - sandbox/share/paths/7/identity
    - sandbox/share/paths/8/from
    - sandbox/share/paths/8/identity
    # The launcher: claudish-compaction starts its build through
    # ./bin/claudish-compaction, every other variant through
    # ./bin/claudish-unattended.
    - harness/binary

variants:
  # claudish with no context tool.
  - name: claudish-baseline
    params:
      binary: ./bin/claudish-unattended
      tool: claudish-baseline
  # rtk as a claudish toolCall hook: the Bash command is rewritten in the
  # model's response, before Claude Code runs it.
  - name: claudish-rtk
    params:
      binary: ./bin/claudish-unattended
      tool: claudish-rtk
  # context-mode staged as a plugin, as in the native variant. Fetch it first
  # with fetch-context-mode.sh.
  - name: claudish-context-mode
    params:
      binary: ./bin/claudish-unattended
      tool: claudish-context-mode
      plugins: [./vendor/context-mode/plugins/claude-code]
  # Context Gateway between Claude Code and claudish (harnessGateway.url), with
  # the native local variant's config: trimming, no model call of its own.
  - name: claudish-context-gateway-local
    params:
      binary: ./bin/claudish-unattended
      tool: claudish-context-gateway-local
  # The same as claudish-context-gateway-local with a locally patched gateway
  # build whose stream buffer keeps an event cut across two reads whole. Pass
  # --param gateway_bin=/absolute/path/to/that/build; without it the provision
  # step errors.
  - name: claudish-context-gateway-local-streamfix
    params:
      binary: ./bin/claudish-unattended
      tool: claudish-context-gateway-local
      gateway_bin: ./config/no-gateway-bin
  # claudish's own compaction on claude-haiku-5-5: a large tool output is
  # compressed once and the stored text sent again, and a history summary is
  # prepared ahead. A local build, started by ./bin/claudish-compaction with
  # --compaction --debug-claudish. Pass --param claudish_build=/absolute/path/to/a
  # compiled claudish (bun run build:binary, signed again with codesign)
  # and --param claudish_config=/absolute/path/to/a/0600/config with the
  # compaction block and the Anthropic API key; without them the run errors
  # before the agent starts.
  - name: claudish-compaction
    params:
      binary: ./bin/claudish-compaction
      tool: claudish-compaction
