description: "the model axis on long-session-scoped: the cost policy against no compaction, with path-scoped test runs and the bun shim"
bench: ./madbench.yaml

# Case d with path-named test runs (the long-session-scoped Scenario; see its
# comment in madbench.yaml), on the cost policy and with no compaction, for
# models other than the bench default: claude-opus-5-5 and claude-fable-5-2.
#
# Every variant sets case_prep: long-session-xl (../tools/cases-prep). It runs
# long-session's preparation unchanged (a 200,000-token window for Claude Code
# and claudish), and puts a `bun` shim first on the agent's PATH that refuses a
# whole-suite `bun test` (bun-shim.sh), the same for every variant and model.
# Do not pass --param case_prep: a CLI --param overrides the variant's value,
# and the run would lose the shim. The results compare only within this file:
# history-policy.experiment.yaml runs long-session with no shim and unscoped
# test runs.
#
# One variant per madbench call, one trial per call:
#
#   madbench cases/history-policy-scoped.experiment.yaml --variant history-cost \
#     --scenario long-session-scoped \
#     --param model=claude-opus-5-5 \
#     --param claudish_build=/absolute/path/to/a/compiled/claudish \
#     --param claudish_config=/absolute/path/to/a/0600/config/with/policy/cost
#
# The baseline variant takes no claudish_config. The compaction Haiku call
# keeps the model its policy config names, whatever the main model is.
guard_changes:
  allow:
    - harness/binary
    - sandbox/provision/steps/1

variants:
  # The build with --debug-claudish and no --compaction. No key file.
  - name: history-baseline
    params:
      binary: ../bin/claudish-build-plain
      tool: cases-baseline
      case_prep: long-session-xl
  # summary at 0.5; swap when the break-even function says it pays, when the
  # next request would cross Claude Code's point, or when the cache is cold.
  - name: history-cost
    params:
      binary: ../bin/claudish-compaction
      tool: policy-cost
      case_prep: long-session-xl
