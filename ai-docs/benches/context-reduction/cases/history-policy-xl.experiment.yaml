description: "history policies on the long-session-xl Scenario: three swap policies against no compaction, on Sonnet 5.5 and Haiku 5.5"
bench: ./madbench.yaml

# The same variants as history-policy.experiment.yaml without history-topic,
# on the long-session-xl Scenario: case d's four turns, a second feature on the
# config file, then long outputs, long reads and recall (12 turns, 127 hidden
# tests). Both models run with a 200,000-token window
# (--param case_prep=long-session), so claudish's history limit is 200,000 on
# both: the limit is the lower of the model's catalog window (1,000,000 for
# both) and the launch's CLAUDE_CODE_AUTO_COMPACT_WINDOW.
#
# One variant per madbench call, one trial per call:
#
#   madbench cases/history-policy-xl.experiment.yaml --variant history-cost \
#     --scenario long-session-xl --param case_prep=long-session \
#     --param model=claude-haiku-5-5 \
#     --param claudish_build=/absolute/path/to/a/compiled/claudish \
#     --param claudish_config=/absolute/path/to/a/0600/config/with/policy/cost
#
# --param model is claude-sonnet-5-5 or claude-haiku-5-5. The baseline variant
# takes no claudish_config. On Haiku, requests above 100,000 input tokens pay
# the upper price band; the readout (tools/cases-readout/history-readout.ts)
# reports their share and cost per trial.
guard_changes:
  allow:
    - harness/binary
    - sandbox/provision/steps/1

variants:
  # The build with --debug-claudish and no --compaction. No key file.
  - name: history-baseline
    params:
      binary: ../bin/claudish-build-plain
      tool: cases-baseline
  # precompute 0.6, apply 0.75.
  - name: history-threshold
    params:
      binary: ../bin/claudish-compaction
      tool: policy-threshold
  # precompute 0.5, apply 0.7.
  - name: history-early
    params:
      binary: ../bin/claudish-compaction
      tool: policy-early
  # summary at 0.5; swap when the break-even function says it pays, when the
  # next request would cross Claude Code's point, or when the cache is cold.
  - name: history-cost
    params:
      binary: ../bin/claudish-compaction
      tool: policy-cost
