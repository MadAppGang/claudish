description: "history policies: claudish's history compaction under four swap policies, against no compaction"
bench: ./madbench.yaml

# Every variant runs the build named by --param claudish_build, on the
# long-session Scenarios with --param case_prep=long-session. The policy variants
# read compaction.history.policy from the config that --param
# claudish_config names; each variant's start.sh refuses a config for another
# policy, so a config passed to the wrong variant stops the trial before spend.
# The model is --param model (default claude-sonnet-5-5). One variant per
# madbench call, one trial per call:
#
#   madbench cases/history-policy.experiment.yaml --variant history-cost \
#     --scenario long-session --param case_prep=long-session \
#     --param claudish_build=/absolute/path/to/a/compiled/claudish \
#     --param claudish_config=/absolute/path/to/a/0600/config/with/policy/cost
#
# The baseline variant takes no claudish_config.
guard_changes:
  allow:
    - harness/binary
    - sandbox/provision/steps/1

variants:
  # The build with --debug-claudish and no --compaction. No key file.
  - name: history-baseline
    params:
      binary: ../bin/claudish-build-plain
      tool: cases-baseline
  # precompute 0.6, apply 0.75.
  - name: history-threshold
    params:
      binary: ../bin/claudish-compaction
      tool: policy-threshold
  # precompute 0.5, apply 0.7.
  - name: history-early
    params:
      binary: ../bin/claudish-compaction
      tool: policy-early
  # summary at 0.5; swap when the break-even function says it pays, when the
  # next request would cross Claude Code's point, or when the cache is cold.
  - name: history-cost
    params:
      binary: ../bin/claudish-compaction
      tool: policy-cost
  # swap when a decider labels the new human turn a change of topic. The
  # decider (haiku or embed) comes from the claudish_config file, so topic
  # and topic+embed run as this one variant with two config files.
  - name: history-topic
    params:
      binary: ../bin/claudish-compaction
      tool: policy-topic
