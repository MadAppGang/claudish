      4. Get the work reviewed. Start one more subagent with the Agent tool and have it review every file you changed against the list in item 2, point by point, and look for a case the tests miss. Wait for its report. Fix each real finding. Then, from `packages/cli`, run `bun test` on the same test files by path, and `bun run typecheck`, once more.

      Do not change `bun.lock` or any `package.json`. Do not add dependencies. Do not stop to ask me anything: I am away until you finish. End with the test and typecheck results and the list of files you changed.
    follow_ups:
      - "Run `bun test src/adapters src/handlers` from `packages/cli` and read its complete output: do not pipe it through tail, head or grep. Then run `bun run typecheck` and `bun run build` from `packages/cli`, also with complete output. Fix anything that fails, and give me the totals."
      - "Read `packages/cli/src/cli.ts` and `packages/cli/src/claude-runner.ts` in full, every line, without subagents. Then write `packages/cli/CONTEXT-WINDOW.md`: how the `--context-window` value travels from the command line to an LM Studio or an Ollama request, with each function name in order and the file it is in."
      - "In two sentences: what were the two exploration subagents in the first turn asked to map? Then run `bun test src/adapters src/handlers` and `bun run typecheck` from `packages/cli` one last time, with complete output, and give me the totals."
      - |
        A second feature, on top of the first: a default window in claudish's config file, so a user does not have to type the flag every time.

        1. Start one subagent with the Agent tool to map how `loadConfig` and `saveConfig` in `packages/cli/src/profile-config.ts` handle the config's fields, and wait for its report before you edit anything.

        2. Build it in `packages/cli`:
           - `ClaudishProfileConfig` gets a field `contextWindow`: a size in the flag's syntax, written as text (`96k`, `1.5m`) or as a number (`64000`).
           - `loadConfig()` keeps the field, so it survives a load followed by `saveConfig`.
           - `contextWindowLimit()` returns the size in `CLAUDISH_CONTEXT_WINDOW` when that is a valid size, else the size in the config file's `contextWindow` when that is a valid size, else `undefined`. A bad value in either place is skipped, never an error. It reads the config on every call, so an edit to the file takes effect at once.
           - The flag still wins over the config, because claudish writes it to `CLAUDISH_CONTEXT_WINDOW`.

        3. Add tests beside the code they cover. From `packages/cli`, run `bun test` followed by the path of each test file you added or changed, and `bun run typecheck`. Fix what fails.

        Do not change `bun.lock` or any `package.json`. Do not stop to ask me anything.
      - "Get the config work reviewed. Start one subagent with the Agent tool and have it review every file you changed for the config's `contextWindow` against the four points of item 2 in my last message, point by point, and look for a case the tests miss. Wait for its report. Fix each real finding. Then, from `packages/cli`, run `bun test` followed by the path of each test file you added or changed for the config's `contextWindow`, and `bun run typecheck`."
      - "Run `bun test src/adapters src/handlers` from `packages/cli` and read its complete output: do not pipe it through tail, head or grep. Then run `bun run typecheck` and `bun run build` from `packages/cli`, also with complete output. Fix anything that fails, and give me the totals."
      - "Read `packages/cli/src/profile-config.ts` and `packages/cli/src/providers/context-window-limit.ts` in full, every line, without subagents. Then add a section to `packages/cli/CONTEXT-WINDOW.md`: where the config's `contextWindow` is read, and which size wins when the flag, `CLAUDISH_CONTEXT_WINDOW` and the config file each name one."
      - "Run `bun test` on every test file you created or changed in this session, in one command, from `packages/cli`, with complete output. Then run `bun run typecheck`. Fix anything that fails, and give me the totals."
      - "Read `packages/cli/src/index.ts` from its first line to the line that writes `CLAUDISH_CONTEXT_WINDOW`, every line, without subagents. Then tell me in two sentences whether anything in that part reads the window before the flag's value is written, and name the function if it does."
      - "In three sentences, without reading any file again: what were the two exploration subagents in the first turn asked to map, what did the subagent of the config feature map, and what did the two review subagents find? Then run `bun test src/adapters src/handlers` and `bun run typecheck` from `packages/cli` with complete output, and give me the totals."
      - "List every file you changed in this session, grouped by the feature it belongs to. Then run `bun test` on the test files of both features in one command and `bun run typecheck`, from `packages/cli`, with complete output, and give me the totals."
    checks:
      # The grade: all 127 hidden tests (114 of the flag, 13 of the config
      # field), after the last turn.
      - type: custom:exec
        metric: Graded
        command: ["bun", "../checks/grade-xl-check.ts"]
        timeout: "600s"
