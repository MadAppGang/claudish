        command: ["bun", "./checks/refactor-check.ts"]
        timeout: "600s"
      # D: the regression test fails without the fix and passes with it.
      - type: custom:exec
        metric: GradedRegression
        command: ["bun", "./checks/regression-check.ts"]
        timeout: "600s"
      - type: file-changes
        metric: StayedInBounds
        must:
          create: [answers.md, packages/cli/src/providers/claude-subscription-route.ts, packages/cli/src/adapters/gemini-parallel-tool-order.test.ts]
          update: [packages/cli/src/adapters/gemini-api-format.ts, packages/cli/src/providers/native-route.ts]
        must-not:
          touch: [bun.lock, package.json, packages/cli/package.json]
        ignore: [logs]
      - type: exec
        metric: CompactionOrder
        readout: true
        in_sandbox: true
        cmd: sh "$HOME/.bench-tools/cases-readout/compaction-order.sh"; ls "$HOME"/.claude/projects/*/*.jsonl >/dev/null 2>&1
        timeout: "60s"
      - type: exec
        metric: VariantCheck
        readout: true
        in_sandbox: true
        cmd: sh "$HOME/.bench-tools/{{tool}}/variant-check.sh"
        timeout: "60s"
      - type: exec
        metric: ToolEvidence
        readout: true
