description: "compaction cases: claudish with and without --compaction, on one build, across task shapes"

# One Scenario per case. ./compaction-cases.experiment.yaml holds the two
# variants. Run each variant as its own madbench call with --variant and --scenario,
# and pass the case's preparation with --param case_prep=<name>:
#
#   madbench cases/compaction-cases.experiment.yaml --variant cases-baseline \
#     --scenario research --param case_prep=research \
#     --param claudish_build=/absolute/path/to/a/compiled/claudish
#
#   madbench cases/compaction-cases.experiment.yaml --variant cases-compaction \
#     --scenario research --param case_prep=research \
#     --param claudish_build=/absolute/path/to/a/compiled/claudish \
#     --param claudish_config=/absolute/path/to/a/0600/config
#
# Only the compaction call names a claudish_config, so the baseline variant never
# gets a file with a key; its start.sh refuses one.

params:
  model: claude-sonnet-5-5
  # The launcher in ../bin and the folder in ../tools of the variant.
  binary: ../bin/claudish-build-plain
  tool: cases-baseline
  # A script in ../tools/cases-prep run in the workspace before the agent.
  case_prep: none
  # The claudish build both variants run (a compiled executable) and the config
  # of the compaction variant. The defaults refuse to start.
  claudish_build: ../config/no-claudish-build
  claudish_config: ../config/no-claudish-config.json
  # Claude Code's settings for the agent. ../config/inline-max raises
  # bashOutputMaxChars from its default 30000 to its maximum 128000, so a
  # Bash output up to 128,000 characters reaches the model inline instead of
  # as a short preview and a file path. Pass it to both variants of a case.
  cc_settings: ../config/base

harness:
  type: claude-code
  binary: "{{binary}}"
  model: "{{model}}"
  use_subscription: required
  config:
    dirs: ["{{cc_settings}}"]
  args:
    - --permission-mode
    - bypassPermissions

defaults:
  sandbox:
    level: home
    # Foreground subagents, as in ../madbench.yaml. Bash calls get 10 minutes
    # by default: Claude Code's own default is 2 minutes, which kills the
    # adapters and handlers tests (95 s on an idle host) under load, so their
    # full output never reaches the model.
    # ~/.local/bin and ~/.local/share/claude are not shared: shared read-write
    # (the only live share at level home), a self-update inside the sandbox
    # rewrote the user's real ~/.local/bin/claude to the sandbox's own path,
    # and every Claude Code on the host failed once the sandbox was removed.
    # The runner puts the pinned claude first on PATH; context-gateway (E2-E4)
    # is the one file copied in. DISABLE_AUTOUPDATER stops the self-update.
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
      BASH_DEFAULT_TIMEOUT_MS: "600000"
      BASH_MAX_TIMEOUT_MS: "600000"
    share:
      paths:
        - { from: ~/.bun, to: ~/.bun, access: rw }
        - { from: ~/.local/bin/context-gateway, to: ~/.local/bin/context-gateway, access: copy }
        - { from: ../tools, to: ~/.bench-tools, access: copy }
        - { from: ../out, to: ~/.bench-out, access: rw }
        - { from: "{{claudish_build}}", to: ~/.bench-compaction/build, access: copy }
        - { from: "{{claudish_config}}", to: ~/.bench-compaction/config.json, access: copy }
    provision:
      timeout: 5m
      steps:
        - sh "$HOME/.bench-tools/cases-prep/{{case_prep}}.sh"
        # The config copy goes in every run, whatever start.sh did.
        - s=0; sh "$HOME/.bench-tools/{{tool}}/start.sh" || s=$?; rm -f "$HOME/.bench-compaction/config.json"; exit $s
  interactive: true
  timeout: 75m
  capture: log

driver:
  answers:
    - match: "*"
      choose: 1

metrics:
  - { name: grade, source: check.score, check: Graded, aggregate: mean, better: higher }
  - { name: cost, source: session.cost, aggregate: sum, unit: usd, better: lower }
  - { name: prompt_tokens, source: session.prompt_tokens, aggregate: mean, unit: tokens, better: lower }
  - { name: output_tokens, source: session.output_tokens, aggregate: mean, unit: tokens, better: lower }
  - { name: cache_read, source: session.cache_read_tokens, aggregate: mean, unit: tokens }
  - { name: cache_creation, source: session.cache_creation_tokens, aggregate: mean, unit: tokens }
  - { name: model_requests, source: session.model_requests, aggregate: mean, better: lower }
  - { name: steps_main, source: session.steps.main, aggregate: mean }
  - { name: steps_all, source: session.steps.all, aggregate: mean }
  - { name: duration, source: scenario.duration, aggregate: mean, better: lower }

scenarios:
  # Case d: a session long enough to fill a 200,000-token window. Run with
  # --param case_prep=long-session, which makes both launchers export
  # CLAUDE_CODE_AUTO_COMPACT_WINDOW=200000. The first turn is the task of
  # ../madbench.yaml, word for word, graded by its 114 hidden tests; three
  # follow-ups add long outputs and long reads to the same session. The
  # follow-ups run the adapters and handlers tests, not the whole suite: the
  # whole suite takes 44 minutes, longer than Claude Code's 10-minute Bash
  # limit, so the agent backgrounds it and reads only small tails of it. The
  # scoped run takes about 95 s and prints about 100,000 characters.
  - name: long-session
    description: "the --context-window task, then three turns of full test output and long reads, in a 200K window"
    repo:
      url: ../../../..
      ref: fe1a93ec9d6bc63538bbb1401663eb30a51e2e33
    timeout: 150m
    prompt: |
      I want a new claudish flag: `--context-window <size>`. It sets the context window for a local model (LM Studio or Ollama). Today the LM Studio window is fixed at 64,000 tokens and I cannot change it from the command line.

      Work in this order.

      1. Explore first, with subagents. Start at least two subagents with the Agent tool, at the same time, and wait for their reports before you edit anything. One maps how `packages/cli/src/cli.ts` parses flags (`parseArgs`, the passthrough walker that decides which arguments go to Claude Code) and how a flag value reaches the proxy. The other maps how the local providers decide their context window: the LM Studio instance code (`ensureLMStudioInstance`, the machine and device selection under `packages/cli/src/providers/`), the local transport under `packages/cli/src/providers/transport/`, the Ollama path, and the picker rows built by `expandModelsToMachines`.

      2. Build the feature in `packages/cli`:
         - `--context-window <size>` accepts a plain number or a number with a `k` or `m` suffix, in either case, with an optional decimal: `128000`, `128k`, `64K`, `1m`, `1.5m`. It refuses an empty value, `abc`, `0`, `-5`, `12x` and `k`.
         - `parseArgs` sets `config.contextWindow` to the number of tokens. With no flag it stays undefined. A bad value prints an error that names `--context-window` and exits with code 1.
         - A new module `packages/cli/src/providers/context-window-limit.ts` exports `parseContextWindow(text)`, which returns the number of tokens or `undefined` for a bad value, and `contextWindowLimit()`, which reads the environment variable `CLAUDISH_CONTEXT_WINDOW`.
         - claudish writes the flag's value to `CLAUDISH_CONTEXT_WINDOW` before the proxy starts, so every local provider path reads one value.
         - The value is a limit, not a demand: the window in use is the lesser of the limit and what the model has loaded. It applies to local providers only (lmstudio, ollama).
         - The LM Studio default rises from 64,000 to 128,000 tokens.
         - Picker rows from `expandModelsToMachines` carry `maxContextWindow`: the model's maximum, or, for a copy that already runs on that machine, the size that copy was loaded with.
         - When `ensureLMStudioInstance` refuses because a running instance has a smaller window, the message names the flag with the running size, for example `--context-window 8192`.
         - A limit above the model's maximum loads the maximum.
         - The passthrough walker treats `--context-window 128k` as claudish's own flag with one value, and does not pass it to Claude Code.
         - The flag appears in the `--help` text.

      3. Add tests for what you built, beside the code they cover, and run them with `bun test` from `packages/cli`. Run `bun run typecheck` there too. Fix what fails.

      4. Get the work reviewed. Start one more subagent with the Agent tool and have it review every file you changed against the list in item 2, point by point, and look for a case the tests miss. Wait for its report. Fix each real finding. Then run `bun test` and `bun run typecheck` from `packages/cli` once more.

      Do not change `bun.lock` or any `package.json`. Do not add dependencies. Do not stop to ask me anything: I am away until you finish. End with the test and typecheck results and the list of files you changed.
    follow_ups:
      - "Run `bun test src/adapters src/handlers` from `packages/cli` and read its complete output: do not pipe it through tail, head or grep. Then run `bun run typecheck` and `bun run build` from `packages/cli`, also with complete output. Fix anything that fails, and give me the totals."
      - "Read `packages/cli/src/cli.ts` and `packages/cli/src/claude-runner.ts` in full, every line, without subagents. Then write `packages/cli/CONTEXT-WINDOW.md`: how the `--context-window` value travels from the command line to an LM Studio or an Ollama request, with each function name in order and the file it is in."
      - "In two sentences: what were the two exploration subagents in the first turn asked to map? Then run `bun test src/adapters src/handlers` and `bun run typecheck` from `packages/cli` one last time, with complete output, and give me the totals."
    checks:
      # The grade: the 114 hidden tests of ../madbench.yaml, after the last turn.
      - type: custom:exec
        metric: Graded
        command: ["bun", "../checks/grade-check.ts"]
        timeout: "600s"
      - type: file-changes
        metric: StayedInBounds
        must:
          create: packages/cli/src/providers/context-window-limit.ts
          update: packages/cli/src/cli.ts
        must-not:
          touch: [bun.lock, package.json, packages/cli/package.json]
        ignore: [logs]
      # Which compaction came first: Claude Code's or claudish's.
      - type: exec
        metric: CompactionOrder
        readout: true
        in_sandbox: true
        cmd: sh "$HOME/.bench-tools/cases-readout/compaction-order.sh"; ls "$HOME"/.claude/projects/*/*.jsonl >/dev/null 2>&1
        timeout: "60s"
      - type: exec
        metric: VariantCheck
        readout: true
        in_sandbox: true
        cmd: sh "$HOME/.bench-tools/{{tool}}/variant-check.sh"
        timeout: "60s"
      - type: exec
        metric: ToolEvidence
        readout: true
        in_sandbox: true
        cmd: sh "$HOME/.bench-tools/{{tool}}/evidence.sh"; ls "$HOME"/.claude/projects/*/*.jsonl >/dev/null 2>&1
        timeout: "60s"

  # Case d without the forced whole-file reads. Everything is as in
  # long-session except two things. The second follow-up asks for the same
  # document but leaves to the agent what to read, instead of "Read cli.ts and
  # claude-runner.ts in full, every line". And items 3 and 4 of the task name
  # their test runs by path, as long-session-xl does: a bare `bun test` runs
  # all 659 test files of packages/cli, about 2.5 h in the sandbox. The first
  # and third follow-ups still FORCE the complete test, typecheck and build
  # output. Run through ./history-policy-natural.experiment.yaml, whose
  # variants set case_prep long-session-xl (a 200K window and the bun shim
  # that refuses a bare `bun test`); do not pass --param case_prep.
  - name: long-session-natural
    description: "the --context-window task, then three turns of full test output and a self-directed trace, in a 200K window"
    repo:
      url: ../../../..
      ref: fe1a93ec9d6bc63538bbb1401663eb30a51e2e33
    timeout: 150m
    prompt: |
