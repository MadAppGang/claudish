         - A new module `packages/cli/src/providers/context-window-limit.ts` exports `parseContextWindow(text)`, which returns the number of tokens or `undefined` for a bad value, and `contextWindowLimit()`, which reads the environment variable `CLAUDISH_CONTEXT_WINDOW`.
         - claudish writes the flag's value to `CLAUDISH_CONTEXT_WINDOW` before the proxy starts, so every local provider path reads one value.
         - The value is a limit, not a demand: the window in use is the lesser of the limit and what the model has loaded. It applies to local providers only (lmstudio, ollama).
         - The LM Studio default rises from 64,000 to 128,000 tokens.
         - Picker rows from `expandModelsToMachines` carry `maxContextWindow`: the model's maximum, or, for a copy that already runs on that machine, the size that copy was loaded with.
         - When `ensureLMStudioInstance` refuses because a running instance has a smaller window, the message names the flag with the running size, for example `--context-window 8192`.
         - A limit above the model's maximum loads the maximum.
         - The passthrough walker treats `--context-window 128k` as claudish's own flag with one value, and does not pass it to Claude Code.
         - The flag appears in the `--help` text.

      3. Add tests for what you built, beside the code they cover, and run them from `packages/cli` with `bun test` followed by the path of each test file you added or changed. Run `bun run typecheck` there too. Fix what fails.

      4. Get the work reviewed. Start one more subagent with the Agent tool and have it review every file you changed against the list in item 2, point by point, and look for a case the tests miss. Wait for its report. Fix each real finding. Then, from `packages/cli`, run `bun test` on the same test files by path, and `bun run typecheck`, once more.

