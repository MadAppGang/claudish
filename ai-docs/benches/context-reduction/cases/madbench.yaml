description: "compaction cases: claudish with and without --compaction, on one build, across task shapes"

# One Scenario per case. ./compaction-cases.experiment.yaml holds the two
# arms. Run each arm as its own madbench call with --variant and --scenario,
# and pass the case's preparation with --param case_prep=<name>:
#
#   madbench cases/compaction-cases.experiment.yaml --variant cases-baseline \
#     --scenario research --param case_prep=research \
#     --param claudish_build=/absolute/path/to/a/compiled/claudish
#
#   madbench cases/compaction-cases.experiment.yaml --variant cases-compaction \
#     --scenario research --param case_prep=research \
#     --param claudish_build=/absolute/path/to/a/compiled/claudish \
#     --param claudish_config=/absolute/path/to/a/0600/config
#
# Only the compaction call names a claudish_config, so the baseline arm never
# gets a file with a key; its start.sh refuses one.

params:
  model: claude-sonnet-5-5
  # The launcher in ../bin and the folder in ../tools of the arm.
  binary: ../bin/claudish-build-plain
  tool: cases-baseline
  # A script in ../tools/cases-prep run in the workspace before the agent.
  case_prep: none
  # The claudish build both arms run (a compiled executable) and the config
  # of the compaction arm. The defaults refuse to start.
  claudish_build: ../config/no-claudish-build
  claudish_config: ../config/no-claudish-config.json
  # Claude Code's settings for the agent. ../config/inline-max raises
  # bashOutputMaxChars from its default 30000 to its maximum 128000, so a
  # Bash output up to 128,000 characters reaches the model inline instead of
  # as a short preview and a file path. Pass it to both arms of a case.
  cc_settings: ../config/base

harness:
  type: claude-code
  binary: "{{binary}}"
  model: "{{model}}"
  use_subscription: required
  config:
    dirs: ["{{cc_settings}}"]
  args:
    - --permission-mode
    - bypassPermissions

defaults:
  sandbox:
    level: home
    # Foreground subagents, as in ../madbench.yaml. Bash calls get 10 minutes
    # by default: Claude Code's own default is 2 minutes, which kills the
    # adapters and handlers tests (95 s on an idle host) under load, so their
    # full output never reaches the model.
    env:
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
      BASH_DEFAULT_TIMEOUT_MS: "600000"
      BASH_MAX_TIMEOUT_MS: "600000"
    share:
      paths:
        - { from: ~/.bun, to: ~/.bun, access: rw }
        - { from: ~/.local/bin, to: ~/.local/bin, access: rw }
        - { from: ~/.local/share/claude, to: ~/.local/share/claude, access: rw }
        - { from: ../tools, to: ~/.bench-tools, access: copy }
        - { from: ../out, to: ~/.bench-out, access: rw }
        - { from: "{{claudish_build}}", to: ~/.bench-compaction/build, access: copy }
        - { from: "{{claudish_config}}", to: ~/.bench-compaction/config.json, access: copy }
    provision:
      timeout: 5m
      steps:
        - sh "$HOME/.bench-tools/cases-prep/{{case_prep}}.sh"
        # The config copy goes in every run, whatever start.sh did.
        - s=0; sh "$HOME/.bench-tools/{{tool}}/start.sh" || s=$?; rm -f "$HOME/.bench-compaction/config.json"; exit $s
  interactive: true
  timeout: 75m
  capture: log

driver:
  answers:
    - match: "*"
      choose: 1

metrics:
  - { name: grade, source: check.score, check: Graded, aggregate: mean, better: higher }
  - { name: cost, source: session.cost, aggregate: sum, unit: usd, better: lower }
  - { name: prompt_tokens, source: session.prompt_tokens, aggregate: mean, unit: tokens, better: lower }
  - { name: output_tokens, source: session.output_tokens, aggregate: mean, unit: tokens, better: lower }
  - { name: cache_read, source: session.cache_read_tokens, aggregate: mean, unit: tokens }
  - { name: cache_creation, source: session.cache_creation_tokens, aggregate: mean, unit: tokens }
  - { name: model_requests, source: session.model_requests, aggregate: mean, better: lower }
  - { name: steps_main, source: session.steps.main, aggregate: mean }
  - { name: steps_all, source: session.steps.all, aggregate: mean }
  - { name: duration, source: scenario.duration, aggregate: mean, better: lower }

scenarios:
  # Case d: a session long enough to fill a 200,000-token window. Run with
  # --param case_prep=long-session, which makes both launchers export
  # CLAUDE_CODE_AUTO_COMPACT_WINDOW=200000. The first turn is the task of
  # ../madbench.yaml, word for word, graded by its 114 hidden tests; three
  # follow-ups add long outputs and long reads to the same session. The
  # follow-ups run the adapters and handlers tests, not the whole suite: the
  # whole suite takes 44 minutes, longer than Claude Code's 10-minute Bash
  # limit, so the agent backgrounds it and reads only small tails of it. The
  # scoped run takes about 95 s and prints about 100,000 characters.
  - name: long-session
    description: "the --context-window task, then three turns of full test output and long reads, in a 200K window"
    repo:
      url: ../../../..
      ref: fe1a93ec9d6bc63538bbb1401663eb30a51e2e33
    timeout: 150m
    prompt: |
      I want a new claudish flag: `--context-window <size>`. It sets the context window for a local model (LM Studio or Ollama). Today the LM Studio window is fixed at 64,000 tokens and I cannot change it from the command line.

      Work in this order.

      1. Explore first, with subagents. Start at least two subagents with the Agent tool, at the same time, and wait for their reports before you edit anything. One maps how `packages/cli/src/cli.ts` parses flags (`parseArgs`, the passthrough walker that decides which arguments go to Claude Code) and how a flag value reaches the proxy. The other maps how the local providers decide their context window: the LM Studio instance code (`ensureLMStudioInstance`, the machine and device selection under `packages/cli/src/providers/`), the local transport under `packages/cli/src/providers/transport/`, the Ollama path, and the picker rows built by `expandModelsToMachines`.

      2. Build the feature in `packages/cli`:
         - `--context-window <size>` accepts a plain number or a number with a `k` or `m` suffix, in either case, with an optional decimal: `128000`, `128k`, `64K`, `1m`, `1.5m`. It refuses an empty value, `abc`, `0`, `-5`, `12x` and `k`.
         - `parseArgs` sets `config.contextWindow` to the number of tokens. With no flag it stays undefined. A bad value prints an error that names `--context-window` and exits with code 1.
         - A new module `packages/cli/src/providers/context-window-limit.ts` exports `parseContextWindow(text)`, which returns the number of tokens or `undefined` for a bad value, and `contextWindowLimit()`, which reads the environment variable `CLAUDISH_CONTEXT_WINDOW`.
         - claudish writes the flag's value to `CLAUDISH_CONTEXT_WINDOW` before the proxy starts, so every local provider path reads one value.
         - The value is a limit, not a demand: the window in use is the lesser of the limit and what the model has loaded. It applies to local providers only (lmstudio, ollama).
         - The LM Studio default rises from 64,000 to 128,000 tokens.
         - Picker rows from `expandModelsToMachines` carry `maxContextWindow`: the model's maximum, or, for a copy that already runs on that machine, the size that copy was loaded with.
         - When `ensureLMStudioInstance` refuses because a running instance has a smaller window, the message names the flag with the running size, for example `--context-window 8192`.
         - A limit above the model's maximum loads the maximum.
         - The passthrough walker treats `--context-window 128k` as claudish's own flag with one value, and does not pass it to Claude Code.
         - The flag appears in the `--help` text.

      3. Add tests for what you built, beside the code they cover, and run them with `bun test` from `packages/cli`. Run `bun run typecheck` there too. Fix what fails.

      4. Get the work reviewed. Start one more subagent with the Agent tool and have it review every file you changed against the list in item 2, point by point, and look for a case the tests miss. Wait for its report. Fix each real finding. Then run `bun test` and `bun run typecheck` from `packages/cli` once more.

      Do not change `bun.lock` or any `package.json`. Do not add dependencies. Do not stop to ask me anything: I am away until you finish. End with the test and typecheck results and the list of files you changed.
    follow_ups:
      - "Run `bun test src/adapters src/handlers` from `packages/cli` and read its complete output: do not pipe it through tail, head or grep. Then run `bun run typecheck` and `bun run build` from `packages/cli`, also with complete output. Fix anything that fails, and give me the totals."
      - "Read `packages/cli/src/cli.ts` and `packages/cli/src/claude-runner.ts` in full, every line, without subagents. Then write `packages/cli/CONTEXT-WINDOW.md`: how the `--context-window` value travels from the command line to an LM Studio or an Ollama request, with each function name in order and the file it is in."
      - "In two sentences: what were the two exploration subagents in the first turn asked to map? Then run `bun test src/adapters src/handlers` and `bun run typecheck` from `packages/cli` one last time, with complete output, and give me the totals."
    checks:
      # The grade: the 114 hidden tests of ../madbench.yaml, after the last turn.
      - type: custom:exec
        metric: Graded
        command: ["bun", "../checks/grade-check.ts"]
        timeout: "600s"
      - type: file-changes
        metric: StayedInBounds
        must:
          create: packages/cli/src/providers/context-window-limit.ts
          update: packages/cli/src/cli.ts
        must-not:
          touch: [bun.lock, package.json, packages/cli/package.json]
        ignore: [logs]
      # Which compaction came first: Claude Code's or claudish's.
      - type: exec
        metric: CompactionOrder
        readout: true
        in_sandbox: true
        cmd: sh "$HOME/.bench-tools/cases-readout/compaction-order.sh"; ls "$HOME"/.claude/projects/*/*.jsonl >/dev/null 2>&1
        timeout: "60s"
      - type: exec
        metric: VariantCheck
        readout: true
        in_sandbox: true
        cmd: sh "$HOME/.bench-tools/{{tool}}/variant-check.sh"
        timeout: "60s"
      - type: exec
        metric: ToolEvidence
        readout: true
        in_sandbox: true
        cmd: sh "$HOME/.bench-tools/{{tool}}/evidence.sh"; ls "$HOME"/.claude/projects/*/*.jsonl >/dev/null 2>&1
        timeout: "60s"

  # Case d without the forced whole-file reads. Everything is as in
  # long-session except the second follow-up: it asks for the same document
  # but leaves to the agent what to read, instead of "Read cli.ts and
  # claude-runner.ts in full, every line". The first and third follow-ups still
  # FORCE the complete test, typecheck and build output. Run with
  # --param case_prep=long-session.
  - name: long-session-natural
    description: "the --context-window task, then three turns of full test output and a self-directed trace, in a 200K window"
    repo:
      url: ../../../..
      ref: fe1a93ec9d6bc63538bbb1401663eb30a51e2e33
    timeout: 150m
    prompt: |
      I want a new claudish flag: `--context-window <size>`. It sets the context window for a local model (LM Studio or Ollama). Today the LM Studio window is fixed at 64,000 tokens and I cannot change it from the command line.

      Work in this order.

      1. Explore first, with subagents. Start at least two subagents with the Agent tool, at the same time, and wait for their reports before you edit anything. One maps how `packages/cli/src/cli.ts` parses flags (`parseArgs`, the passthrough walker that decides which arguments go to Claude Code) and how a flag value reaches the proxy. The other maps how the local providers decide their context window: the LM Studio instance code (`ensureLMStudioInstance`, the machine and device selection under `packages/cli/src/providers/`), the local transport under `packages/cli/src/providers/transport/`, the Ollama path, and the picker rows built by `expandModelsToMachines`.

      2. Build the feature in `packages/cli`:
         - `--context-window <size>` accepts a plain number or a number with a `k` or `m` suffix, in either case, with an optional decimal: `128000`, `128k`, `64K`, `1m`, `1.5m`. It refuses an empty value, `abc`, `0`, `-5`, `12x` and `k`.
         - `parseArgs` sets `config.contextWindow` to the number of tokens. With no flag it stays undefined. A bad value prints an error that names `--context-window` and exits with code 1.
         - A new module `packages/cli/src/providers/context-window-limit.ts` exports `parseContextWindow(text)`, which returns the number of tokens or `undefined` for a bad value, and `contextWindowLimit()`, which reads the environment variable `CLAUDISH_CONTEXT_WINDOW`.
         - claudish writes the flag's value to `CLAUDISH_CONTEXT_WINDOW` before the proxy starts, so every local provider path reads one value.
         - The value is a limit, not a demand: the window in use is the lesser of the limit and what the model has loaded. It applies to local providers only (lmstudio, ollama).
         - The LM Studio default rises from 64,000 to 128,000 tokens.
         - Picker rows from `expandModelsToMachines` carry `maxContextWindow`: the model's maximum, or, for a copy that already runs on that machine, the size that copy was loaded with.
         - When `ensureLMStudioInstance` refuses because a running instance has a smaller window, the message names the flag with the running size, for example `--context-window 8192`.
         - A limit above the model's maximum loads the maximum.
         - The passthrough walker treats `--context-window 128k` as claudish's own flag with one value, and does not pass it to Claude Code.
         - The flag appears in the `--help` text.

      3. Add tests for what you built, beside the code they cover, and run them with `bun test` from `packages/cli`. Run `bun run typecheck` there too. Fix what fails.

      4. Get the work reviewed. Start one more subagent with the Agent tool and have it review every file you changed against the list in item 2, point by point, and look for a case the tests miss. Wait for its report. Fix each real finding. Then run `bun test` and `bun run typecheck` from `packages/cli` once more.

      Do not change `bun.lock` or any `package.json`. Do not add dependencies. Do not stop to ask me anything: I am away until you finish. End with the test and typecheck results and the list of files you changed.
    follow_ups:
      - "Run `bun test src/adapters src/handlers` from `packages/cli` and read its complete output: do not pipe it through tail, head or grep. Then run `bun run typecheck` and `bun run build` from `packages/cli`, also with complete output. Fix anything that fails, and give me the totals."
      - "Write `packages/cli/CONTEXT-WINDOW.md`: how the `--context-window` value travels from the command line to an LM Studio or an Ollama request, with each function name in order and the file it is in. Trace it yourself, without subagents, and read whatever you need to get it right."
      - "In two sentences: what were the two exploration subagents in the first turn asked to map? Then run `bun test src/adapters src/handlers` and `bun run typecheck` from `packages/cli` one last time, with complete output, and give me the totals."
    checks:
      # The same checks as long-session.
      - type: custom:exec
        metric: Graded
        command: ["bun", "../checks/grade-check.ts"]
        timeout: "600s"
      - type: file-changes
        metric: StayedInBounds
        must:
          create: packages/cli/src/providers/context-window-limit.ts
          update: packages/cli/src/cli.ts
        must-not:
          touch: [bun.lock, package.json, packages/cli/package.json]
        ignore: [logs]
      - type: exec
        metric: CompactionOrder
        readout: true
        in_sandbox: true
        cmd: sh "$HOME/.bench-tools/cases-readout/compaction-order.sh"; ls "$HOME"/.claude/projects/*/*.jsonl >/dev/null 2>&1
        timeout: "60s"
      - type: exec
        metric: VariantCheck
        readout: true
        in_sandbox: true
        cmd: sh "$HOME/.bench-tools/{{tool}}/variant-check.sh"
        timeout: "60s"
      - type: exec
        metric: ToolEvidence
        readout: true
        in_sandbox: true
        cmd: sh "$HOME/.bench-tools/{{tool}}/evidence.sh"; ls "$HOME"/.claude/projects/*/*.jsonl >/dev/null 2>&1
        timeout: "60s"

  # Case a: log-heavy debugging. The workspace is the parent of the fix that
  # orders Gemini function responses by their function calls; the grade is
  # that fix's own test file, copied in after the agent stops. The prompt
  # FORCES long outputs: the adapters and handlers tests print about 112,000
  # characters in about 95 s (the whole suite takes 44 minutes, past Claude
  # Code's 10-minute Bash limit). Run with --param case_prep=install.
  - name: log-debug
    description: "find and fix why a Gemini model gets the wrong tool output after two parallel tool calls, from full test output"
    repo:
      url: ../../../..
      ref: 7f8ffe7faabe19fd4984bdeba663cf383cf9c083
    timeout: 75m
    prompt: |
      A bug report from a claudish user, on a Gemini model through the Gemini API:

      "When the model calls two tools in one turn, for example two Read calls on two different files, it sometimes answers as if each Read returned the other file. There is no error anywhere. It looks like it happens when the second tool finishes first."

      Find the cause in claudish and fix it.

      1. From `packages/cli`, run `bun test src/adapters src/handlers` and `bun run build`, and read their complete output: do not pipe them through tail, head or grep.
      2. Find the cause and fix it in the source. Add a test, beside the code it covers, that fails without your fix and passes with it.
      3. Run `bun test src/adapters src/handlers` and `bun run typecheck` from `packages/cli` again, with complete output, and fix what fails.

      Do not change `bun.lock` or any `package.json`. Do not stop to ask me anything: I am away until you finish. End with the cause, the test results and the list of files you changed.
    checks:
      - type: custom:exec
        metric: Graded
        command: ["bun", "./checks/log-debug-check.ts"]
        timeout: "600s"
      # The defect is in convertMessages in gemini-api-format.ts, so a fix
      # updates that file. The rule also makes the check fail when the agent
      # does nothing.
      - type: file-changes
        metric: StayedInBounds
        must:
          update: packages/cli/src/adapters/gemini-api-format.ts
        must-not:
          touch: [bun.lock, package.json, packages/cli/package.json]
        ignore: [logs]
      - type: exec
        metric: VariantCheck
        readout: true
        in_sandbox: true
        cmd: sh "$HOME/.bench-tools/{{tool}}/variant-check.sh"
        timeout: "60s"
      - type: exec
        metric: ToolEvidence
        readout: true
        in_sandbox: true
        cmd: sh "$HOME/.bench-tools/{{tool}}/evidence.sh"; ls "$HOME"/.claude/projects/*/*.jsonl >/dev/null 2>&1
        timeout: "60s"

  # Case c: a mechanical refactor across the largest files. Run with
  # --param case_prep=install.
  - name: refactor
    description: "rename nativeRouteFor to claudeSubscriptionRoute and move it to its own module, in 17 files"
    repo:
      url: ../../../..
      ref: 533e4233b9d0c6b49bfc2420fcc76d9626169677
    timeout: 60m
    prompt: |
      Refactor claudish in `packages/cli/src`. Keep the behaviour exactly as it is.

      1. Rename the exported function `nativeRouteFor` (now in `packages/cli/src/providers/native-route.ts`) to `claudeSubscriptionRoute`.
      2. Move it to a new module, `packages/cli/src/providers/claude-subscription-route.ts`, which exports it. `native-route.ts` must not define it or re-export it any more.
      3. Update every caller and every test, and every comment that names the old function. When you are done, the name `nativeRouteFor` must not appear anywhere under `packages/cli/src`.
      4. Run `bun run typecheck` from `packages/cli`, and `bun test` for the test files you changed, and fix what fails.

      Do not change `bun.lock` or any `package.json`. Do not stop to ask me anything: I am away until you finish. End with the typecheck and test results and the list of files you changed.
    checks:
      - type: custom:exec
        metric: Graded
        command: ["bun", "./checks/refactor-check.ts"]
        timeout: "600s"
      - type: file-changes
        metric: StayedInBounds
        must:
          create: packages/cli/src/providers/claude-subscription-route.ts
          update: packages/cli/src/providers/native-route.ts
        must-not:
          touch: [bun.lock, package.json, packages/cli/package.json]
        ignore: [logs]
      - type: exec
        metric: VariantCheck
        readout: true
        in_sandbox: true
        cmd: sh "$HOME/.bench-tools/{{tool}}/variant-check.sh"
        timeout: "60s"
      - type: exec
        metric: ToolEvidence
        readout: true
        in_sandbox: true
        cmd: sh "$HOME/.bench-tools/{{tool}}/evidence.sh"; ls "$HOME"/.claude/projects/*/*.jsonl >/dev/null 2>&1
        timeout: "60s"

  # Case e: research with many parallel subagents, read only. Run with
  # --param case_prep=research.
  - name: research
    description: "answer 12 questions about claudish from its source, with at least 6 parallel Explore subagents"
    repo:
      url: ../../../..
      ref: 533e4233b9d0c6b49bfc2420fcc76d9626169677
    timeout: 45m
    prompt: |
      I need exact answers to 12 questions about this claudish source tree. Answer from the code in `packages/cli/src`, not from memory.

      Work in this order.

      1. Start at least 6 subagents with the Agent tool (subagent_type Explore), all at the same time, and give each two of the questions below. Wait for all their reports.
      2. Check each answer in the code yourself where a report is unsure.
      3. Write the file `answers.md` in the top-level folder: exactly 12 lines, one per question, in the form `N. value`. The value only: no backticks, no explanation.

      Questions:

      1. What is the lowest magmux version claudish accepts for a pane session? (a version string)
      2. Which function decides whether one environment variable is withheld from a pane child's environment? (a function name)
      3. claudish remaps terminal upstream errors to HTTP 400. Which file defines the function that recovers the real upstream status? (a path from the top-level folder)
      4. Which environment variable does claudish set to "1" in pure proxy mode so that Claude Code skips its fast-mode organisation check? (a variable name)
      5. Which function under `packages/cli/src/pane/` tells whether the current process runs inside a session that a claudish MCP server started? (a function name)
      6. Under `~/.claudish/`, what is the file name of the key claudish uses to name the files of the dynamic models catalog? (a file name)
      7. Which environment variable lets a parent process choose where the proxy's token tracker writes its counts, ahead of the port? (a variable name)
      8. For how many milliseconds is an account's dynamic models catalog list young enough to deny a model? (an integer)
      9. After how many milliseconds without a stream event does the Responses stream stall guard fire by default? (an integer)
      10. claudish can collect a complete message from an SSE stream outside the Responses parser. What stall timeout, in milliseconds, does that collector use? (an integer)
      11. Which file defines the function that decides whether a model spec goes to the native Claude passthrough (a bare Claude name such as `opus`)? (a path from the top-level folder)
      12. Which environment variable does claudish set to "1" for every child it starts in an MCP pane session, so that a claudish inside knows it is one level deep? (a variable name)

      Do not change any file except `answers.md`. Do not stop to ask me anything: I am away until you finish.
    checks:
      - type: custom:exec
        metric: Graded
        command: ["bun", "./checks/answers-check.ts"]
        timeout: "60s"
      - { type: session:subagent-count, metric: Delegated, value: 6 }
      - type: file-changes
        metric: StayedInBounds
        must:
          create: answers.md
        default: []
        ignore: [logs]
      - type: exec
        metric: VariantCheck
        readout: true
        in_sandbox: true
        cmd: sh "$HOME/.bench-tools/{{tool}}/variant-check.sh"
        timeout: "60s"
      - type: exec
        metric: ToolEvidence
        readout: true
        in_sandbox: true
        cmd: sh "$HOME/.bench-tools/{{tool}}/evidence.sh"; ls "$HOME"/.claude/projects/*/*.jsonl >/dev/null 2>&1
        timeout: "60s"

  # Topic changes in one session, for a compaction that decides on a change
  # of topic. Five turns on one snapshot, each a task of its own:
  #   A (prompt)     the Gemini tool-output bug of log-debug    start
  #   B (follow-up)  the 12 research questions, read in person  TRUE change
  #   C (follow-up)  the nativeRouteFor refactor                TRUE change
  #   D (follow-up)  a regression test for A's fix              NOT a change
  #   E (follow-up)  a doc comment in C's new module            NOT a change
  # A, B, C and D are graded by the graders of log-debug, research and
  # refactor, and by checks/regression-check.ts. A asks for no test, so D's
  # test is new work that only the session's memory of A can direct. B forbids
  # subagents, so the reading lands in the main context. Run with
  # --param case_prep=long-session (a 200K auto-compact window).
  - name: topic-change
    description: "five tasks in one session, two true topic changes and two returns, in a 200K window"
    repo:
      url: ../../../..
      ref: 7f8ffe7faabe19fd4984bdeba663cf383cf9c083
    timeout: 180m
    prompt: |
      A bug report from a claudish user, on a Gemini model through the Gemini API:

      "When the model calls two tools in one turn, for example two Read calls on two different files, it sometimes answers as if each Read returned the other file. There is no error anywhere. It looks like it happens when the second tool finishes first."

      Find the cause in claudish and fix it.

      1. From `packages/cli`, run `bun test src/adapters src/handlers` and `bun run build`, and read their complete output: do not pipe them through tail, head or grep.
      2. Find the cause and fix it in the source.
      3. Run `bun test src/adapters src/handlers` and `bun run typecheck` from `packages/cli` again, with complete output, and fix what fails.

      Do not change `bun.lock` or any `package.json`. Do not stop to ask me anything: I am away until you finish. End with the cause, the test results and the list of files you changed.
    follow_ups:
      - |
        New task, unrelated to the bug. I need exact answers to 12 questions about this claudish source tree. Answer from the code in `packages/cli/src`, not from memory. Read the code yourself, without subagents.

