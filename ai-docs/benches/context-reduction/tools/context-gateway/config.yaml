# Context Gateway configuration for the bench run.
#
# Every model call goes to api.anthropic.com, signed with the Bearer the gateway
# captures from Claude Code's own requests (auth: oauth). No Compresr endpoint is
# configured: urls.compresr is empty, there is no compresr block, and no pipe
# uses the compresr strategy.
#
# Relative paths resolve against the directory start.sh starts the gateway in.

metadata:
  name: "bench"
  description: "tool output compression and history summarization on Haiku"
  strategy: "external_provider"

server:
  port: 18431
  read_timeout: 30s
  write_timeout: 1000s

urls:
  compresr: ""

providers:
  anthropic:
    auth: "oauth"
    model: "claude-haiku-5-5"

preemptive:
  enabled: true
  trigger_threshold: 85.0
  add_response_headers: true
  log_dir: "logs"
  compaction_log_path: "logs/history_compaction.jsonl"
  summarizer:
    strategy: "external_provider"
    provider: "anthropic"
    max_tokens: 4096
    timeout: 60s
  session:
    summary_ttl: 3h
    hash_message_count: 3

pipes:
  tool_output:
    enabled: true
    strategy: "external_provider"
    provider: "anthropic"
    min_tokens: 512
    max_tokens: 128000
    target_compression_ratio: 0.5
    refusal_threshold: 0.05
    enable_expand_context: true

  # The gateway forces every pipe on, so "off" is the passthrough strategy.
  tool_discovery:
    enabled: true
    strategy: "passthrough"

  task_output:
    enabled: true
    strategy: "passthrough"

cost_control:
  enabled: false
  session_cap: 0
  global_cap: 0

notifications:
  slack:
    enabled: false

post_session:
  enabled: false

store:
  type: "memory"
  ttl: 3h

monitoring:
  log_level: "info"
  log_format: "console"
  log_output: "stdout"
  telemetry_enabled: true
  verbose_payloads: false
  telemetry_path: "logs/telemetry.jsonl"
  compression_log_path: "logs/tool_output_compression.jsonl"
  tool_discovery_log_path: "logs/tool_discovery.jsonl"
  task_output_log_path: "logs/task_output"
  session_tools_path: "logs/session_tools.json"
  session_stats_path: "logs/session_stats.json"
  expand_context_calls_path: "logs/expand_context_calls.jsonl"
