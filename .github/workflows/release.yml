name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write  # Required for npm OIDC trusted publishing

jobs:
  # Every binary is built on Linux: Bun cross-compiles the darwin targets, and test.yml's
  # darwin-binaries job builds them the same way on every PR. A Linux-built darwin binary is
  # already ad-hoc signed by Bun (`codesign -dv`: flags=0x20002(adhoc,linker-signed)),
  # `codesign -v` passes on an arm64 Mac, and both darwin binaries run there.
  build:
    strategy:
      matrix:
        include:
          - os: blacksmith-2vcpu-ubuntu-2404-arm
            target: bun-darwin-arm64
            artifact: claudish-darwin-arm64
            goos: darwin
            goarch: arm64
          - os: blacksmith-2vcpu-ubuntu-2404-arm
            target: bun-darwin-x64
            artifact: claudish-darwin-x64
            goos: darwin
            goarch: amd64
          - os: blacksmith-2vcpu-ubuntu-2404-arm
            target: bun-linux-x64
            artifact: claudish-linux-x64
            goos: linux
            goarch: amd64
          - os: blacksmith-2vcpu-ubuntu-2404-arm
            target: bun-linux-arm64
            artifact: claudish-linux-arm64
            goos: linux
            goarch: arm64

    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: useblacksmith/checkout@v1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download the pinned magmux release
        run: |
          # PINNED, never "latest": MCP team slots and create_session run in magmux panes
          # and need magmux >= MIN_MAGMUX_VERSION (packages/cli/src/pane/pane-launch.ts),
          # and a new magmux release must not change what an existing claudish tag ships.
          # The tag and checksums live in .github/magmux.env, which `bun run test:macos`
          # installs from too: the release ships the magmux tag whose Darwin asset for this
          # Mac's architecture the pane suites ran against before the tag. The other
          # platform assets of that tag are pinned by checksum, not tested here.
          set -a; . .github/magmux.env; set +a
          MIN=$(sed -n 's/^export const MIN_MAGMUX_VERSION = "\(.*\)";$/\1/p' packages/cli/src/pane/pane-launch.ts)
          if [ -z "$MIN" ]; then echo "MIN_MAGMUX_VERSION not found in pane-launch.ts"; exit 1; fi
          if [ "$(printf '%s\n%s\n' "$MIN" "${MAGMUX_TAG#v}" | sort -V | head -n 1)" != "$MIN" ]; then
            echo "pinned magmux ${MAGMUX_TAG} is older than MIN_MAGMUX_VERSION ${MIN}"; exit 1
          fi
          echo "Using magmux ${MAGMUX_TAG} (panes need >= ${MIN})"
          ASSET="magmux_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          WANT=$(eval echo "\$MAGMUX_SHA256_${{ matrix.goos }}_${{ matrix.goarch }}")
          if [ -z "$WANT" ]; then echo "no pinned checksum for ${ASSET} in .github/magmux.env"; exit 1; fi
          gh release download "${MAGMUX_TAG}" --repo MadAppGang/magmux --pattern "${ASSET}" --dir /tmp
          # the PINNED sum, not the release's own checksums.txt: that one moves with the asset
          echo "${WANT}  /tmp/${ASSET}" | shasum -a 256 -c -
          tar xzf "/tmp/${ASSET}" -C /tmp
          # The version check runs the binary, so only where the target is the host (the
          # linux rows); a darwin magmux cannot run on Linux. The pinned sum above checks
          # every row.
          HOST_OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          HOST_ARCH=$(uname -m); case "$HOST_ARCH" in (arm64|aarch64) HOST_ARCH=arm64;; (x86_64) HOST_ARCH=amd64;; esac
          if [ "$HOST_OS" = "${{ matrix.goos }}" ] && [ "$HOST_ARCH" = "${{ matrix.goarch }}" ]; then
            /tmp/magmux --version | grep -q "${MAGMUX_TAG#v}" || { echo "downloaded magmux is not ${MAGMUX_TAG}"; /tmp/magmux --version; exit 1; }
          fi
          # Rename to Node.js platform-arch convention (amd64 → x64)
          NODE_ARCH="${{ matrix.goarch }}"
          if [ "$NODE_ARCH" = "amd64" ]; then NODE_ARCH="x64"; fi
          mkdir -p packages/cli/native
          mv /tmp/magmux "packages/cli/native/magmux-${{ matrix.goos }}-${NODE_ARCH}"
          chmod +x "packages/cli/native/magmux-${{ matrix.goos }}-${NODE_ARCH}"
          ls -la packages/cli/native/magmux-*
        env:
          GH_TOKEN: ${{ github.token }}

      # Every platform's optional native packages: a plain install on Linux brings only
      # @opentui/core-linux-*, and a darwin build then fails to resolve
      # @opentui/core-darwin-<arch>.
      - name: Install dependencies
        run: bun install --os='*' --cpu='*'

      - name: Build CLI
        run: bun run build:cli

      - name: Build binary
        run: |
          # Inject version from tag into fallback (for compiled binaries)
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i.bak "s/VERSION = \".*\"/VERSION = \"$VERSION\"/" packages/cli/src/cli.ts
          # Build from root to preserve workspace resolution
          bun build packages/cli/src/index.ts --compile --no-compile-autoload-dotenv --target=${{ matrix.target }} --outfile ${{ matrix.artifact }}

      # The binary cannot run on this host, so check its Mach-O arch and the embedded OpenTUI
      # library of its own target. Bun's ad-hoc signature replaces a codesign step.
      - name: Check the darwin binary
        if: startsWith(matrix.target, 'bun-darwin')
        run: scripts/check-darwin-binary.sh ${{ matrix.artifact }} ${{ matrix.goarch }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload magmux artifact
        uses: actions/upload-artifact@v5
        with:
          name: magmux-${{ matrix.artifact }}
          path: packages/cli/native/magmux-*

  # The publish waits on this job: a bundled recommended list unchanged since the previous
  # tag stops the release. The routing rulebook review runs on the Mac before the tag
  # (`bun run review:routing`).
  bundled-list:
    name: refuse a stale bundled recommended list
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      BUNDLED_LIST: packages/cli/src/providers/bundled-recommended-list.json
    steps:
      - name: Check out the tag with its history
        uses: useblacksmith/checkout@v1 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Refuse a stale bundled recommended list
        run: |
          set -euo pipefail

          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "skipped: not a tag ref"
              exit 0
              ;;
          esac

          earlier=$(git tag --list 'v*' --merged "${GITHUB_REF_NAME}^")
          if [ -z "$earlier" ]; then
            echo "skipped: no earlier release tag"
            exit 0
          fi

          # The nearest v* tag that is an ancestor of this one, which is not always
          # the highest version number: a tag on another line can be higher.
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^")

          # Exit 0 means unchanged, 1 means changed, anything else is git failing.
          if git diff --quiet "$prev" "$GITHUB_REF_NAME" -- "$BUNDLED_LIST"; then
            echo "::error::the bundled recommended list was not regenerated in this release's bump PR; run \`bun run --cwd packages/cli generate:bundled-list\`"
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error::git diff failed with exit code $status"
              exit "$status"
            fi
          fi
          echo "bundled recommended list changed since $prev"

  release:
    needs: [build, bundled-list]
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0  # Full history for generating release notes from commits

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v2  # no Node 24 version; covered by FORCE_JAVASCRIPT_ACTIONS_TO_NODE24

      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          CURRENT_TAG="v${VERSION}"
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | grep -v "^${CURRENT_TAG}$" | head -1)

          # Generate release notes for this tag only
          if [ -n "$PREV_TAG" ]; then
            git cliff "${PREV_TAG}..${CURRENT_TAG}" --strip header -o release-notes.md
          else
            git cliff --strip header -o release-notes.md
          fi

          # Append install section
          {
            echo ""
            echo "## Install"
            echo ""
            echo '```bash'
            echo "# npm"
            echo "npm install -g claudish"
            echo ""
            echo "# Homebrew"
            echo "brew install MadAppGang/tap/claudish"
            echo ""
            echo "# or download binary from assets below"
            echo '```'
          } >> release-notes.md

          # Add compare link
          if [ -n "$PREV_TAG" ]; then
            echo "" >> release-notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}" >> release-notes.md
          fi

          echo "Generated release notes:"
          cat release-notes.md

      - name: Update CHANGELOG.md
        # The changelog commit is cosmetic and MUST NOT be able to block the
        # release/publish steps below it. The tag-push that triggers this
        # workflow can race with other pushes to main, leaving HEAD behind
        # origin/main and rejecting the push (non-fast-forward) — which, under
        # `bash -e`, used to abort the whole `release` job before the GitHub
        # Release was created, so publish-npm/update-homebrew (needs: release)
        # never ran. We now (1) rebase onto origin/main so it lands in the
        # normal case, and (2) make the push non-fatal so a still-racing push
        # can never abort the job. Tag-after-main-is-settled is still the right
        # habit, but the release no longer depends on it.
        run: |
          git cliff -o CHANGELOG.md
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "docs: update CHANGELOG.md for v${GITHUB_REF#refs/tags/v}"
            # Reconcile with any pushes that landed on main since the tag, so
            # the changelog commit fast-forwards in the normal case.
            git pull --rebase origin main || echo "rebase skipped; attempting push anyway"
            # Non-fatal: a rejected push must never abort the release.
            git push origin HEAD:main || echo "changelog push skipped (main moved); release continues"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            # Copy all files from each artifact directory into release/
            # Handles both claudish binaries (file matches dir name) and
            # magmux binaries (file is magmux-*, dir is magmux-claudish-*)
            find "$dir" -type f | while read -r file; do
              cp "$file" "release/$(basename "$file")"
              chmod +x "release/$(basename "$file")"
            done
          done
          ls -la release/

      - name: Generate manifest and checksums
        run: |
          bun scripts/generate-manifest.ts ${{ steps.version.outputs.version }} release
          cat release/manifest.json
          cat release/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2  # no Node 24 version; covered by FORCE_JAVASCRIPT_ACTIONS_TO_NODE24
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            release/claudish-*
            release/magmux-*
            release/manifest.json
            release/checksums.txt
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}

  publish-npm:
    needs: release
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    # OIDC trusted publishing - no NPM_TOKEN needed!
    # Configure at: https://www.npmjs.com/package/claudish/access (Trusted Publishers)

    steps:
      - uses: useblacksmith/checkout@v1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true

      - name: Install dependencies
        run: bun install

      - name: Download magmux binaries
        uses: actions/download-artifact@v5
        with:
          pattern: magmux-*
          path: magmux-artifacts

      - name: Install magmux binaries
        run: |
          mkdir -p packages/cli/native
          for dir in magmux-artifacts/*/; do
            cp "$dir"/magmux-* packages/cli/native/ 2>/dev/null || true
          done
          chmod +x packages/cli/native/magmux-* 2>/dev/null || true
          echo "Magmux binaries:"
          ls -la packages/cli/native/magmux-*

      - name: Publish magmux platform packages
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          for pkg in packages/magmux-*/; do
            name=$(basename "$pkg")
            platform_arch="${name#magmux-}"

            # Copy the correct binary
            mkdir -p "${pkg}bin"
            cp "packages/cli/native/magmux-${platform_arch}" "${pkg}bin/magmux"
            chmod +x "${pkg}bin/magmux"

            # Update version
            cd "$pkg"
            node -e "const p=require('./package.json'); p.version='${VERSION}'; require('fs').writeFileSync('package.json', JSON.stringify(p,null,2))"

            echo "Publishing @claudish/${name} v${VERSION}..."
            bun ../../scripts/publish-npm-package.ts .
            cd ../..
          done

      - name: Build packages
        run: bun run build:cli

      - name: Prepare for npm publish
        run: |
          cd packages/cli
          # Fix files array for npm publish
          VERSION="${GITHUB_REF#refs/tags/v}"
          node -e "
            const pkg = require('./package.json');
            delete pkg.dependencies['@claudish/core'];
            // bin/ is more than the launcher: claudish.cjs requires its siblings
            // (env-files.cjs). npm always ships the bin entry itself, so leaving
            // bin/ out drops only the siblings and every install fails to start.
            // herdr-app-mod/ holds the Herdr.app mod that `claudish herdr
            // install-app-mod` copies; release-files.test.ts checks this list.
            pkg.files = ['dist/', 'bin/', 'herdr-app-mod/', 'AI_AGENT_GUIDE.md', 'skills/'];
            // Sync optionalDependencies versions to release version
            if (pkg.optionalDependencies) {
              for (const key of Object.keys(pkg.optionalDependencies)) {
                if (key.startsWith('@claudish/magmux-')) {
                  pkg.optionalDependencies[key] = '${VERSION}';
                }
              }
            }
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2));
          "
          echo 'Modified package.json:'
          cat package.json

      # Install the exact tarball npm will receive and start it. The tests run the
      # source tree, so a file the files list leaves out is invisible to them;
      # 13.0.0 shipped without bin/env-files.cjs and could not start at all.
      - name: Smoke-test the packed package
        run: |
          cd packages/cli
          TARBALL="$PWD/$(npm pack --silent)"
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$TARBALL"
          node node_modules/claudish/bin/claudish.cjs --version
          test -s node_modules/claudish/herdr-app-mod/claudish/main.js
          test -s node_modules/claudish/herdr-app-mod/claudish/mod.json
          rm -f "$TARBALL"

      - name: Publish to npm
        run: bun scripts/publish-npm-package.ts packages/cli

  update-homebrew:
    needs: release
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    if: ${{ vars.ENABLE_HOMEBREW == 'true' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Get release info
        id: release
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Wait for release assets
          sleep 10

          # Get checksums
          curl -sL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/checksums.txt" -o checksums.txt

          # Match the whole filename field: checksums.txt also lists magmux-darwin-*, which a
          # bare "darwin-arm64" grep would match too, giving the formula two sums.
          ARM64_SHA=$(awk '$2 == "claudish-darwin-arm64" {print $1}' checksums.txt)
          X64_SHA=$(awk '$2 == "claudish-darwin-x64" {print $1}' checksums.txt)

          echo "arm64_sha=$ARM64_SHA" >> $GITHUB_OUTPUT
          echo "x64_sha=$X64_SHA" >> $GITHUB_OUTPUT

      - name: Update Homebrew tap
        uses: useblacksmith/checkout@v1
        with:
          repository: MadAppGang/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        run: |
          mkdir -p tap/Formula
          cat > tap/Formula/claudish.rb << EOF
          class Claudish < Formula
            desc "Multi-model AI CLI - run Claude Code with any model"
            homepage "https://github.com/MadAppGang/claudish"
            version "${{ steps.release.outputs.version }}"
            license "MIT"

            on_arm do
              url "https://github.com/MadAppGang/claudish/releases/download/v${{ steps.release.outputs.version }}/claudish-darwin-arm64"
              sha256 "${{ steps.release.outputs.arm64_sha }}"
            end

            on_intel do
              url "https://github.com/MadAppGang/claudish/releases/download/v${{ steps.release.outputs.version }}/claudish-darwin-x64"
              sha256 "${{ steps.release.outputs.x64_sha }}"
            end

            def install
              binary = "claudish-darwin-#{Hardware::CPU.arch == :arm64 ? "arm64" : "x64"}"
              bin.install binary => "claudish"
            end

            test do
              assert_match "claudish", shell_output("#{bin}/claudish --version")
            end
          end
          EOF

      - name: Push to tap
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/claudish.rb
          git commit -m "Update claudish to v${{ steps.release.outputs.version }}"
          git push
