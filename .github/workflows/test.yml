name: Tests

# The hermetic test gate.
#
# WHY THIS EXISTS: until now no workflow ran `bun test` at all. The green check
# on a PR came from the review bot, so a merge could publish to npm with the
# suite never having run. A regex that silently deleted Gemini answers shipped
# for seven months and five releases behind exactly that gap.
#
# WHY NO API KEY SECRETS ARE SET HERE — this is load-bearing, not an oversight.
# Real-API tests gate on `test-helpers/credential-gate.ts`, which asks
# claudish's OWN CredentialAuthority whether a provider can be served (env →
# config `apiKeys` → 1Password). With no credentials present that answer is
# `false` everywhere, so every live test skips itself and what remains is
# exactly the deterministic tier: adapters, stream parsers, routing, fixtures.
# Measured locally in a credential-free environment: 1855 pass / 25 skip /
# 0 fail in ~56s, versus ~235s and real billing when keys ARE present.
#
# Adding a key secret here would silently convert this gate into the flaky,
# billable live suite. Live coverage belongs in smoke-test.yml, which is
# manually dispatched and holds the secrets on purpose.

on:
  pull_request:
  push:
    branches: [main]

# A superseded push should not keep burning a runner.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The hermetic suite is cut into slices that run at the same time, so the gate takes as
  # long as its slowest slice, not as long as the whole suite (about 25 minutes run whole).
  # packages/cli/scripts/ci-tests.ts owns the file list, the groups and the slices; the
  # slices are balanced by scripts/ci-test-times.json (refresh it from these jobs' junit:
  # `bun scripts/ci-tests.ts --update-times junit-*.xml`).
  #
  # WHERE EACH GROUP RUNS, measured on PR #328 (run 39545203694):
  # - idle (recovery ladders, the grok refresh ceiling) passes 54/54 on ubuntu and is CPU-idle,
  #   so it runs there, in three slices.
  # - pane (real magmux panes) and rest stay on macOS: on ubuntu-latest pane fails 23 tests
  #   and rest 11 (credential, keychain and platform paths written for darwin).
  # The org is on the free plan: 5 macOS jobs at once across every repo, against 20 Linux
  # ones. So macOS runs two runners, each with several slices as concurrent processes; the
  # pane slices mostly wait on magmux's fixed send windows, not on CPU.
  #
  # Every bun is the PINNED 1.3.10, not `latest`. Measured on run 31174096977: a newer bun's
  # `bun install` REWRITES packages/cli/package.json (expanding the `files` array), which
  # biome then fails as a format error. `latest` also lets a bun release break CI overnight.
  #
  # CLAUDISH_SKIP_LIVE_E2E is REQUIRED wherever tests run. mcp-session/e2e-sessions.test.ts
  # probes for a usable Claude Code at MODULE LOAD by spawning `claude --version` and
  # awaiting only its `exit` event. A runner has no `claude`, so spawn emits `error`, the
  # promise never settles, and the suite hangs until the job is killed (run 31172281077).
  static:
    name: typecheck · lint
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      # Root install — `workspaces: ["packages/*"]`, so this covers cli AND macos-bridge.
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      # Fails on ERRORS only. The ~800 warnings (noExplicitAny,
      # noExcessiveCognitiveComplexity) are pre-existing style debt, which biome exits 0 for.
      - name: Lint
        run: bun run lint

  idle:
    name: hermetic · idle ${{ matrix.slice }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLAUDISH_SKIP_LIVE_E2E: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Tests
        working-directory: packages/cli
        run: bun scripts/ci-tests.ts --run idle@${{ matrix.slice }}/3 -- --reporter=junit --reporter-outfile=junit-{label}.xml
        timeout-minutes: 10
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: junit-idle-${{ matrix.slice }}
          path: packages/cli/junit-*.xml

  hermetic:
    name: hermetic · macOS ${{ matrix.runner }}/2
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: 1
            runs: pane@1/6,pane@2/6,pane@3/6,rest
          - runner: 2
            runs: pane@4/6,pane@5/6,pane@6/6
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLAUDISH_SKIP_LIVE_E2E: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      # The pane suites run against the SAME magmux the release ships (.github/magmux.env).
      - uses: ./.github/actions/install-magmux
        with:
          token: ${{ github.token }}
      # --max-concurrency bounds each process's concurrent tests (Bun's default is 20). The
      # runner has 3 vCPUs and runs several processes: at 20, pane-hooks' concurrent describes
      # boot 20 panes beside the other slices and miss their settle bounds (run 39547642291).
      - name: Tests (${{ matrix.runs }})
        working-directory: packages/cli
        run: bun scripts/ci-tests.ts --run ${{ matrix.runs }} -- --max-concurrency=8 --reporter=junit --reporter-outfile=junit-{label}.xml
        timeout-minutes: 15
      - name: macos-bridge and script tests
        if: matrix.runner == 2
        run: |
          bun run --cwd packages/macos-bridge test
          bun test ./scripts/*.test.ts
        timeout-minutes: 5
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: junit-macos-${{ matrix.runner }}
          path: packages/cli/junit-*.xml

  # The blind hook tests, on Bun 1.4.0 instead of the pinned 1.3.10. Two of them
  # fail on 1.3.10 because of bugs in Bun's TEST client, not in claudish, and pass
  # 20 of 20 on 1.4.0 (reproduced on 1.3.10 with no claudish code in the loop):
  # C-17, a fetch reader.cancel() that never closes the connection, and X-12, a
  # paused-then-resumed node:child_process reader that drops every byte. The
  # blind TYPECHECK stays in the static job, under the pinned Bun. This job does
  # not lint, so a newer bun rewriting packages/cli/package.json on install does
  # not matter here.
  blind-hooks:
    name: blind hook tests · bun 1.4.0
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same pinned magmux as the hermetic jobs, so the blind tests run in the same environment.
      - uses: ./.github/actions/install-magmux
        with:
          token: ${{ github.token }}

      - name: Blind hook tests
        working-directory: packages/cli
        run: bun test src/hooks/blind
        timeout-minutes: 15
        env:
          CLAUDISH_SKIP_LIVE_E2E: "1"

  # S1: a user hook module (.ts type import, .ts value import through the
  # Bun.plugin virtual module, .js) loads from a `--target bun` bundle and from a
  # `--compile` binary. The hermetic jobs run the same test on macOS with
  # the pinned 1.3.10; this job runs it on every OS/arch release.yml builds a
  # binary for, with the Bun release.yml builds with (`latest`), because that is
  # the binary magus installs. The test imports no dependency, so there is no
  # `bun install` (and no package.json rewrite by a newer bun).
  hooks-loading:
    name: hook module loading · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: S1 hook loading (source, dist bundle, compiled binary)
        run: bun test packages/cli/src/hooks/s1-probe/
        timeout-minutes: 5
