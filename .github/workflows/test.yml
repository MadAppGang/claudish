name: Tests

# The hermetic test gate.
#
# WHY THIS EXISTS: until now no workflow ran `bun test` at all. The green check
# on a PR came from the review bot, so a merge could publish to npm with the
# suite never having run. A regex that silently deleted Gemini answers shipped
# for seven months and five releases behind exactly that gap.
#
# WHY NO API KEY SECRETS ARE SET HERE — this is load-bearing, not an oversight.
# Real-API tests gate on `test-helpers/credential-gate.ts`, which asks
# claudish's OWN CredentialAuthority whether a provider can be served (env →
# config `apiKeys` → 1Password). With no credentials present that answer is
# `false` everywhere, so every live test skips itself and what remains is
# exactly the deterministic tier: adapters, stream parsers, routing, fixtures.
# Measured locally in a credential-free environment: 1855 pass / 25 skip /
# 0 fail in ~56s, versus ~235s and real billing when keys ARE present.
#
# Adding a key secret here would silently convert this gate into the flaky,
# billable live suite. Live coverage belongs in smoke-test.yml, which is
# manually dispatched and holds the secrets on purpose.

on:
  pull_request:
  push:
    branches: [main]

# A superseded push should not keep burning a runner.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck · lint · hermetic tests
    # macOS, not ubuntu — deliberate. Measured on ubuntu-latest (run
    # 31173939734): the credential-equivalence suite and the magmux e2e fail
    # wholesale because claudish's credential authority reaches for macOS
    # facilities (keychain, `ioreg` screen-lock probe) and the magmux bridge
    # binary is a macOS artifact the release workflow downloads separately.
    # The suite has only ever been developed and run on darwin. Gating on the
    # platform it is actually written for gives a HONEST signal; gating on
    # ubuntu would mean permanently-red checks people learn to ignore.
    # Linux portability of the test suite is a separate piece of work.
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      # PINNED, not `latest`. Measured on run 31174096977: a newer bun's
      # `bun install` REWRITES packages/cli/package.json (expanding the `files`
      # array), which biome then fails as a format error — a red gate caused by
      # an upstream release rather than by the code under test. `latest` also
      # means a bun release can break CI overnight with no commit to blame.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      # Root install — `workspaces: ["packages/*"]`, so this covers cli AND
      # macos-bridge. The root scripts below span both packages; running
      # `--cwd packages/cli` instead would silently drop macos-bridge.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The pane suites run against the SAME magmux the release ships: the tag and
      # checksums in .github/magmux.env, which release.yml reads too. The Homebrew
      # tap served whatever was current, so CI could go green against 0.15 while
      # 0.14.0 shipped untested. Installed to /usr/local/bin, a path
      # findMagmuxForTest() and the launcher both search (no Homebrew copy exists on
      # the runner, so nothing earlier in the search shadows it).
      - name: Install the pinned magmux (pane suites)
        run: |
          set -a; . .github/magmux.env; set +a
          ARCH=$(uname -m); case "$ARCH" in (arm64|aarch64) ARCH=arm64;; (x86_64) ARCH=amd64;; esac
          ASSET="magmux_darwin_${ARCH}.tar.gz"
          WANT=$(eval echo "\$MAGMUX_SHA256_darwin_${ARCH}")
          gh release download "${MAGMUX_TAG}" --repo MadAppGang/magmux --pattern "${ASSET}" --dir /tmp
          echo "${WANT}  /tmp/${ASSET}" | shasum -a 256 -c -
          tar xzf "/tmp/${ASSET}" -C /tmp
          sudo install -m 0755 /tmp/magmux /usr/local/bin/magmux
          magmux --version | grep -q "${MAGMUX_TAG#v}" || { echo "installed magmux is not ${MAGMUX_TAG}"; magmux --version; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Typecheck
        run: bun run typecheck

      # Fails on ERRORS only. The suite currently carries ~797 warnings
      # (noExplicitAny, noExcessiveCognitiveComplexity) which are pre-existing
      # style debt, not defects — biome exits 0 for those, so this gate catches
      # genuine regressions without demanding a 300-file cleanup first.
      - name: Lint
        run: bun run lint

      # CLAUDISH_SKIP_LIVE_E2E is REQUIRED here, and not just an optimisation.
      # mcp-session/e2e-sessions.test.ts probes for a usable Claude Code at MODULE
      # LOAD by spawning `claude --version` and awaiting only its `exit` event.
      # A runner has no `claude` binary, so spawn emits `error` instead, the
      # promise never settles, and the whole suite hangs until the job is
      # killed (observed: >12 min on run 31172281077 before cancellation).
      # The file's own flag short-circuits that probe.
      #
      # The timeout is the backstop: a hang should fail in 25 minutes, not burn a
      # 6-hour runner slot. "A healthy run is ~60s" stopped being true long ago:
      # measured locally (M-series, 2026-10-06) packages/cli alone takes 697 s
      # before the pane suites and 832-846 s with them (bun 1.4.0 and the pinned
      # 1.3.10), already past 10 minutes; the recovery-contract black-box suites
      # and the real-magmux pane suites dominate. On the CI runner main took 1088 s
      # (2026-10-20, run 39383777717) and the gated-delivery suite for magmux's input
      # gate adds ~310 s, so ~26 minutes; 40 minutes leaves ~1.5x headroom.
      #
      # src/hooks/blind is EXCLUDED here and runs in the blind-hooks job below.
      # This is the root `bun run test` spelled out, because Bun 1.3.10 has no way
      # to ignore a path: no --path-ignore-patterns flag, and bunfig's
      # test.pathIgnorePatterns is not read (both measured on 1.3.10). So the cli
      # files are listed explicitly, with Bun's own test-file name rule, and the
      # list must not come back empty. They are passed WITHOUT a leading `./`: Bun
      # then reads them as filters on its own discovery and keeps a bare `bun
      # test`'s file order (measured: same 431 files, same order). `./` paths run
      # in argument order instead, and a few suites share process state across
      # files, so a new order is a new suite.
      - name: Hermetic tests
        shell: bash
        run: |
          cd packages/cli
          FILES=$(find . -name node_modules -prune -o -path ./src/hooks/blind -prune -o -type f -print \
            | grep -E '(\.test|_test_|\.spec|_spec_)[^/]*\.[cm]?[jt]sx?$' | sed 's|^\./||')
          [ -n "$FILES" ] || { echo "no cli test files found"; exit 1; }
          # shellcheck disable=SC2086  # one argument per file; no path holds a space
          bun test $FILES
          cd ../..
          bun run --cwd packages/macos-bridge test
          bun test ./scripts/*.test.ts
        timeout-minutes: 40
        env:
          CLAUDISH_SKIP_LIVE_E2E: "1"

  # The blind hook tests, on Bun 1.4.0 instead of the pinned 1.3.10. Two of them
  # fail on 1.3.10 because of bugs in Bun's TEST client, not in claudish, and pass
  # 20 of 20 on 1.4.0 (reproduced on 1.3.10 with no claudish code in the loop):
  # C-17, a fetch reader.cancel() that never closes the connection, and X-12, a
  # paused-then-resumed node:child_process reader that drops every byte. The
  # blind TYPECHECK stays in the job above, under the pinned Bun. This job does
  # not lint, so a newer bun rewriting packages/cli/package.json on install does
  # not matter here.
  blind-hooks:
    name: blind hook tests · bun 1.4.0
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same pinned magmux as the job above, so the blind tests run in the same
      # environment the hermetic job gives the rest of the suite.
      - name: Install the pinned magmux (pane suites)
        run: |
          set -a; . .github/magmux.env; set +a
          ARCH=$(uname -m); case "$ARCH" in (arm64|aarch64) ARCH=arm64;; (x86_64) ARCH=amd64;; esac
          ASSET="magmux_darwin_${ARCH}.tar.gz"
          WANT=$(eval echo "\$MAGMUX_SHA256_darwin_${ARCH}")
          gh release download "${MAGMUX_TAG}" --repo MadAppGang/magmux --pattern "${ASSET}" --dir /tmp
          echo "${WANT}  /tmp/${ASSET}" | shasum -a 256 -c -
          tar xzf "/tmp/${ASSET}" -C /tmp
          sudo install -m 0755 /tmp/magmux /usr/local/bin/magmux
          magmux --version | grep -q "${MAGMUX_TAG#v}" || { echo "installed magmux is not ${MAGMUX_TAG}"; magmux --version; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Blind hook tests
        working-directory: packages/cli
        run: bun test src/hooks/blind
        timeout-minutes: 15
        env:
          CLAUDISH_SKIP_LIVE_E2E: "1"

  # S1: a user hook module (.ts type import, .ts value import through the
  # Bun.plugin virtual module, .js) loads from a `--target bun` bundle and from a
  # `--compile` binary. The hermetic job above runs the same test on macOS with
  # the pinned 1.3.10; this job runs it on every OS/arch release.yml builds a
  # binary for, with the Bun release.yml builds with (`latest`), because that is
  # the binary magus installs. The test imports no dependency, so there is no
  # `bun install` (and no package.json rewrite by a newer bun).
  hooks-loading:
    name: hook module loading · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: S1 hook loading (source, dist bundle, compiled binary)
        run: bun test packages/cli/src/hooks/s1-probe/
        timeout-minutes: 5
