name: Tests

# The hermetic test gate.
#
# WHY THIS EXISTS: until now no workflow ran `bun test` at all. The green check
# on a PR came from the review bot, so a merge could publish to npm with the
# suite never having run. A regex that silently deleted Gemini answers shipped
# for seven months and five releases behind exactly that gap.
#
# WHY NO API KEY SECRETS ARE SET HERE — this is load-bearing, not an oversight.
# Real-API tests gate on `test-helpers/credential-gate.ts`, which asks
# claudish's OWN CredentialAuthority whether a provider can be served (env →
# config `apiKeys` → 1Password). With no credentials present that answer is
# `false` everywhere, so every live test skips itself and what remains is
# exactly the deterministic tier: adapters, stream parsers, routing, fixtures.
# Measured locally in a credential-free environment: 1855 pass / 25 skip /
# 0 fail in ~56s, versus ~235s and real billing when keys ARE present.
#
# Adding a key secret here would silently convert this gate into the flaky,
# billable live suite. Live coverage belongs in smoke-test.yml, which is
# manually dispatched and holds the secrets on purpose.
#
# WHAT RUNS ON WHICH TRIGGER: every trigger runs the same Linux jobs (typecheck, lint, scripts,
# idle, rest, hooks-loading, darwin-binaries); a manual dispatch changes only the tier. No job
# runs on macOS. The macOS suites (pane, the macOS-only rest files, the blind hook tests, S1
# hook loading on a Mac) run on the owner's Mac: `bun run test:macos` before a release tag
# (scripts/test-macos.ts) and the nightly parts (scripts/weekly-macos-tests.ts).
#
# WHICH TIER: ci-tests.ts selects files by tier (packages/cli/scripts/test-tiers.json). A pull
# request and a push run the ESSENTIAL tier of the idle and rest slices: at most three listed
# files per slow category, whatever their time, the pinned files, and, outside the slow
# categories, no other file measured at the data file's heavySeconds or more. A manual dispatch
# runs the idle and rest slices of the GITHUB tier on Linux, without their macOnly files. The
# GITHUB tier is the essential files plus every weekly file measured under the data file's
# githubMaxSeconds (10 s) or not measured yet. The tier does not cap a job's wall time; the
# target is every job under 50 s. weekly-tests.yml runs the same slices on Sunday. The rest is the WEEKLY tier, and
# scripts/weekly-macos-tests.ts runs one weekly-tier part a night on the owner's Mac, the files
# the github tier leaves out (recovery-ladder 67 s, claude-runner-exit-code 62.5 s, ...)
# included.
#
# THE TIME BUDGET (a target): every job of this workflow well under 50 s, every run under a
# minute. A long check moves to the Mac (`bun run test:macos`, the nightly parts); a timeout is
# never raised to make room. scripts/test-tier-workflows.test.ts checks the planned slices only:
# it fails when a slice's recorded test seconds pass 22 s, or when a job names a macOS runner.
# It cannot see setup (10-20 s a job), queueing behind other runs (20 Linux jobs at once on the
# account), or a file's load time that ci-test-times.json records as 0 s. Read real job times
# with `gh run view <id> --json jobs`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A superseded push should not keep burning a runner. The event is part of the group, so a
# dispatched run and a push to the same branch do not cancel each other.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The hermetic suite is cut into slices that run at the same time, so the gate takes as
  # long as its slowest slice, not as long as the whole suite (about 25 minutes run whole).
  # packages/cli/scripts/ci-tests.ts owns the file list, the groups, the tiers and the slices;
  # the slices are balanced by scripts/ci-test-times.json (refresh it from the junit of a
  # dispatched or weekly run: `bun scripts/ci-tests.ts --update-times junit-*.xml`). The same
  # table decides which files are heavy, so a refresh can move a file between tiers.
  #
  # WHERE EACH GROUP RUNS, measured on PR #328 (run 39545203694):
  # - idle (recovery ladders, the grok refresh ceiling) passes 54/54 on ubuntu and is CPU-idle,
  #   so it runs there, in three slices.
  # - pane (real magmux panes) stays on macOS: on ubuntu-latest it fails 23 tests. It runs on
  #   the owner's Mac (`bun run test:macos`, the nightly parts), never on GitHub.
  # - rest also runs on Linux, in the rest job below, on every PR: 6 jobs, each running 3 of
  #   18 slices as concurrent processes. The files written for the
  #   darwin-only shared Antigravity token store are listed in test-tiers.json's macOnly, and
  #   ci-tests.ts drops them off darwin.
  # The org is on the free plan: 20 Linux jobs at once across every repo, so rest runs three
  # slices per job rather than more jobs, which would queue.
  #
  # Every bun is the PINNED 1.3.10, not `latest`. Measured on run 31174096977: a newer bun's
  # `bun install` REWRITES packages/cli/package.json (expanding the `files` array), which
  # biome then fails as a format error. `latest` also lets a bun release break CI overnight.
  #
  # CLAUDISH_SKIP_LIVE_E2E is REQUIRED wherever tests run. mcp-session/e2e-sessions.test.ts
  # probes for a usable Claude Code at MODULE LOAD by spawning `claude --version` and
  # awaiting only its `exit` event. A runner has no `claude`, so spawn emits `error`, the
  # promise never settles, and the suite hangs until the job is killed (run 31172281077).
  #
  # CLAUDISH_DISABLE_CATALOG_WARM keeps the live catalog service out of the gate. Files that
  # do not set it start a background fetch of the production catalog (queryModels, ~8 s on a
  # runner), and when it lands it can replace another file's test catalog: route() answered
  # no-route in run 39550893135. Every test that needs a warm sets its own env; the rest
  # group passes 5318/5318 with this set. Other live calls (provider model lists, codeium)
  # remain and are tracked separately.
  # Typecheck and lint are two jobs so that they run at the same time: each takes as long as
  # its own check, not as long as both.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      # Root install — `workspaces: ["packages/*"]`, so this covers cli AND macos-bridge.
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      # Root install — `workspaces: ["packages/*"]`, so this covers cli AND macos-bridge.
      - run: bun install --frozen-lockfile
      # Fails on ERRORS only. The ~800 warnings (noExplicitAny,
      # noExcessiveCognitiveComplexity) are pre-existing style debt, which biome exits 0 for.
      - name: Lint
        run: bun run lint

  # scripts/*.test.ts (the release scripts, the test gates, repo invariants such as spawn env
  # and retired terms) and release-files.test.ts read files and run portable shell: nothing in
  # them needs a Mac, so every trigger runs them here. `bun run test:macos` runs them too.
  scripts:
    name: script and release-file tests
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLAUDISH_SKIP_LIVE_E2E: "1"
      CLAUDISH_DISABLE_CATALOG_WARM: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Script tests
        run: bun test ./scripts/*.test.ts
        timeout-minutes: 5
      - name: Release file tests
        working-directory: packages/cli
        run: bun test src/release-files.test.ts
        timeout-minutes: 5

  idle:
    name: hermetic · idle ${{ matrix.slice }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLAUDISH_SKIP_LIVE_E2E: "1"
      CLAUDISH_DISABLE_CATALOG_WARM: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Tests
        working-directory: packages/cli
        run: bun scripts/ci-tests.ts --run idle@${{ matrix.slice }}/3 --tier ${{ github.event_name == 'workflow_dispatch' && 'github' || 'essential' }} -- --reporter=junit --reporter-outfile=junit-{label}.xml
        timeout-minutes: 10
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: junit-idle-${{ matrix.slice }}
          path: packages/cli/junit-*.xml

  # Each job runs three slices of 18 as concurrent `bun test` processes (ci-tests.ts prefixes
  # each output line with its slice). A test file runs in one process on one core, and the
  # public repository's ubuntu-latest runner has 4 vCPUs, so three slices take about as long as
  # one. Job k runs slices k, k+6 and k+12: the planner gives slices 1-3 the heaviest files
  # (the pinned Codex pool tests, about 20 s each), so no job holds two of them.
  rest:
    name: hermetic · rest ${{ matrix.job }}/6
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: 1
            slices: rest@1/18,rest@7/18,rest@13/18
          - job: 2
            slices: rest@2/18,rest@8/18,rest@14/18
          - job: 3
            slices: rest@3/18,rest@9/18,rest@15/18
          - job: 4
            slices: rest@4/18,rest@10/18,rest@16/18
          - job: 5
            slices: rest@5/18,rest@11/18,rest@17/18
          - job: 6
            slices: rest@6/18,rest@12/18,rest@18/18
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLAUDISH_SKIP_LIVE_E2E: "1"
      CLAUDISH_DISABLE_CATALOG_WARM: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Tests
        working-directory: packages/cli
        run: bun scripts/ci-tests.ts --run ${{ matrix.slices }} --tier ${{ github.event_name == 'workflow_dispatch' && 'github' || 'essential' }} -- --reporter=junit --reporter-outfile=junit-{label}.xml
        timeout-minutes: 15
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: junit-rest-${{ matrix.job }}
          path: packages/cli/junit-*.xml

  # S1: a user hook module (.ts type import, .ts value import through the
  # Bun.plugin virtual module, .js) loads from a `--target bun` bundle and from a
  # `--compile` binary. This job runs it on both Linux architectures release.yml builds a
  # binary for, with the Bun release.yml builds with (`latest`), because that is the binary
  # magus installs; `bun run test:macos --full` and the last nightly part run it on the Mac.
  # The test imports no dependency, so there is no `bun install` (and no package.json
  # rewrite by a newer bun).
  hooks-loading:
    name: hook module loading · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "ubuntu-24.04-arm"]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: S1 hook loading (source, dist bundle, compiled binary)
        run: bun test packages/cli/src/hooks/s1-probe/
        timeout-minutes: 5

  # release.yml builds the darwin binaries on Linux, so every PR proves that build: the same
  # Bun (`latest`), install and `bun build` line, then the checks release.yml runs on the
  # result (scripts/check-darwin-binary.sh). `--os='*' --cpu='*'` installs every platform's
  # optional native packages; a plain install on Linux brings only @opentui/core-linux-*, and
  # the darwin build then fails: `Could not resolve: "@opentui/core-darwin-arm64/index.ts"`.
  # No upload: nothing here ships. No lint either, so a newer bun rewriting
  # packages/cli/package.json on install does not matter.
  darwin-binaries:
    name: darwin binaries · build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            arch: arm64
          - target: bun-darwin-x64
            arch: x64
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --os='*' --cpu='*'
      - run: bun run build:cli
      - name: Build binary
        run: bun build packages/cli/src/index.ts --compile --no-compile-autoload-dotenv --target=${{ matrix.target }} --outfile claudish-${{ matrix.target }}
      - name: Check the binary
        run: scripts/check-darwin-binary.sh claudish-${{ matrix.target }} ${{ matrix.arch }}
