name: Weekly full tests

# The idle and rest slices of the GITHUB tier on Linux, once a week. The target is every job
# under 50 s; the tier does not cap a job's wall time.
#
# Pull requests run the essential tier (packages/cli/scripts/test-tiers.json, ci-tests.ts
# `--tier essential`): at most three listed files per slow category, whatever their time, the
# pinned files, and, outside the slow categories, no other file measured at the data file's
# heavySeconds or more. This run adds, in the idle and rest groups and without macOnly files,
# every weekly file measured under the data file's githubMaxSeconds or not measured yet
# (`--tier github`). No Linux job here runs a weekly file measured
# at githubMaxSeconds or more: the owner's Mac does, one weekly-tier part a night
# (scripts/weekly-macos-tests.ts), with the macOS suites (pane, the macOS-only rest files, the
# blind hook tests).
#
# The jobs are test.yml's Linux jobs with `--tier github`, under the same pinned Bun, the same
# slices and the same hermetic environment (no API key secrets: see test.yml's header).
# scripts/test-tier-workflows.test.ts fails when the two drift apart.
#
# THE SIGNAL: a failed scheduled run mails the repository owner (GitHub's own notification for a
# scheduled workflow). The report-failure job also opens one issue titled "Weekly full test run
# failed", or comments on it when it is already open, with the run's URL. Close the issue once
# the run is green again.

on:
  schedule:
    # Sunday 03:00 US Pacific, at standard time (PST, UTC-8). Cron runs in UTC, so under
    # daylight time (PDT) this is 04:00 local.
    - cron: "0 11 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scripts:
    name: script and release-file tests
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLAUDISH_SKIP_LIVE_E2E: "1"
      CLAUDISH_DISABLE_CATALOG_WARM: "1"
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Script tests
        run: bun test ./scripts/*.test.ts
        timeout-minutes: 5
      - name: Release file tests
        working-directory: packages/cli
        run: bun test src/release-files.test.ts
        timeout-minutes: 5

  idle:
    name: hermetic · idle ${{ matrix.slice }}/3 · github tier
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLAUDISH_SKIP_LIVE_E2E: "1"
      CLAUDISH_DISABLE_CATALOG_WARM: "1"
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Tests
        working-directory: packages/cli
        run: bun scripts/ci-tests.ts --run idle@${{ matrix.slice }}/3 --tier github -- --reporter=junit '--reporter-outfile=junit-{label}.xml'
        timeout-minutes: 15
      # This junit refreshes ci-test-times.json (`--update-times`) for every file it holds.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: junit-weekly-idle-${{ matrix.slice }}
          path: packages/cli/junit-*.xml

  # Each job runs three slices of 18 as concurrent `bun test` processes (ci-tests.ts prefixes
  # each output line with its slice). A test file runs in one process on one core, and the
  # public repository's ubuntu-latest runner has 4 vCPUs, so three slices take about as long as
  # one. Job k runs slices k, k+6 and k+12: the planner gives slices 1-3 the heaviest files
  # (the pinned Codex pool tests, about 20 s each), so no job holds two of them.
  rest:
    name: hermetic · rest ${{ matrix.job }}/6 · github tier
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: 1
            slices: rest@1/18,rest@7/18,rest@13/18
          - job: 2
            slices: rest@2/18,rest@8/18,rest@14/18
          - job: 3
            slices: rest@3/18,rest@9/18,rest@15/18
          - job: 4
            slices: rest@4/18,rest@10/18,rest@16/18
          - job: 5
            slices: rest@5/18,rest@11/18,rest@17/18
          - job: 6
            slices: rest@6/18,rest@12/18,rest@18/18
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLAUDISH_SKIP_LIVE_E2E: "1"
      CLAUDISH_DISABLE_CATALOG_WARM: "1"
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Tests
        working-directory: packages/cli
        run: bun scripts/ci-tests.ts --run ${{ matrix.slices }} --tier github -- --reporter=junit '--reporter-outfile=junit-{label}.xml'
        timeout-minutes: 20
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: junit-weekly-rest-${{ matrix.job }}
          path: packages/cli/junit-*.xml

  hooks-loading:
    name: hook module loading · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["blacksmith-4vcpu-ubuntu-2404-arm", "blacksmith-4vcpu-ubuntu-2404-arm"]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: S1 hook loading (source, dist bundle, compiled binary)
        run: bun test packages/cli/src/hooks/s1-probe/
        timeout-minutes: 5

  report-failure:
    name: open or update the failure issue
    needs: [scripts, idle, rest, hooks-loading]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TITLE: Weekly full test run failed
    steps:
      - name: Open or update the issue
        run: |
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="The weekly full test run failed on ${GITHUB_SHA}: ${url}"
          number="$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)"
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body "${body}"
          else
            gh issue create --title "${TITLE}" --body "${body}"
          fi
