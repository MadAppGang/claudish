services:
  claudish-proxy:
    build: .
    container_name: ${CLAUDISH_CONTAINER_NAME:-claudish-proxy}
    restart: unless-stopped
    ports:
      # Host port is per-machine: 3000 is already taken on some sidecar hosts.
      # Container side stays 3000 — see `command:` below.
      - "${CLAUDISH_HOST_PORT:-3000}:3000"
    volumes:
      # Mount config from host (contains API keys, routing, profiles). Defaults to
      # the hub (po-2023) path so the hub compose keeps working with no .env at all;
      # a sidecar sets CLAUDISH_CONFIG_DIR to its own profile, e.g.
      # C:\Users\<user>\.claudish
      - type: bind
        source: ${CLAUDISH_CONFIG_DIR:-C:\Users\jsboi\.claudish}
        target: /root/.claudish
        read_only: true
      # OpenAI Codex OAuth tokens: hub-only bind, deliberately NOT here — a
      # file-type bind whose source is absent breaks (or directory-poisons)
      # every sidecar compose up. The hub carries it in its local
      # docker-compose.override.yml instead (auto-merged, never committed).
      # Persistent diagnostic capture: full request/response bodies for offline
      # analysis. The proxy writes req-*.json / resp-*.sse here (gated by
      # CLAUDISH_CAPTURE_DIR). Compacted nightly by ClaudishCaptureCompaction
      # (compress-captures.ps1), then backed up to GDrive. Override
      # CLAUDISH_CAPTURE_HOST_DIR on machines without a D: drive.
      # Sidecars KEEP capture on: in NOMINAL mode the relay path writes nothing
      # (the hub captures centrally), so any loose req-*/resp-* file on a sidecar
      # is by construction an AUTONOMOUS-mode outage capture — which is exactly
      # what reconcile-outage-captures.ps1 packs and merges back. Setting
      # CLAUDISH_CAPTURE_DIR empty disables writing entirely; that is an escape
      # hatch for disk-starved hosts, NOT the sidecar default, because it would
      # silently destroy the outage-reconciliation trail.
      # NB: CLAUDISH_CAPTURE_HOST_DIR (host bind) is deliberately NOT named
      # CLAUDISH_CAPTURES_DIR — a one-letter delta from the container-side
      # CLAUDISH_CAPTURE_DIR below would be a silent-misconfiguration trap.
      - type: bind
        source: ${CLAUDISH_CAPTURE_HOST_DIR:-D:\claudish-captures}
        target: /captures
    environment:
      - NODE_ENV=production
      - CLAUDISH_PROXY_KEY=${CLAUDISH_PROXY_KEY:-}
      # WebSearch interception endpoint. Public URL sits behind IIS Basic Auth
      # (2026-08-19): WAN machines embed credentials in the URL userinfo
      # (https://user:pass@search.myia.io — parsed by claudish, never logged),
      # LAN machines point at the backend directly (no auth). Default to LAN
      # direct so a fresh deployment works out of the box — the public URL
      # 401s without creds. Never commit credentials here.
      # (runbook _intercom/2026-07-18_runbook-searxng-protection-po2023.md §9-§10).
      - SEARXNG_URL=${SEARXNG_URL:-http://192.168.0.47:8181}
      # Empty disables capture writing (sidecar default; hub leaves it at /captures).
      - CLAUDISH_CAPTURE_DIR=${CLAUDISH_CAPTURE_DIR-/captures}
      # Sidecar relay (fork extension). All empty → this container is the HUB
      # (po-2023): always local, unchanged. On a sidecar machine, set these in the
      # per-machine .env:
      #   CLAUDISH_RELAY_UPSTREAM — hub URL (LAN http://192.168.0.46:3000, WAN https://models.myia.io)
      #   CLAUDISH_RELAY_COMPRESS — 1 on WAN externals (po-2025, web1) only
      #   CLAUDISH_NO_ANTHROPIC   — 1 on every machine except ai-01 (leak-policy backstop)
      - CLAUDISH_RELAY_UPSTREAM=${CLAUDISH_RELAY_UPSTREAM:-}
      - CLAUDISH_RELAY_COMPRESS=${CLAUDISH_RELAY_COMPRESS:-}
      - CLAUDISH_NO_ANTHROPIC=${CLAUDISH_NO_ANTHROPIC:-}
      # Budget failover (fork extension). All empty → inert: no routing change,
      # no notice, zero added bytes. Belongs on the machine that actually CALLS
      # the models — i.e. the hub, since a NOMINAL sidecar only relays.
      # See CLAUDE.md § "Budget Failover".
      - CLAUDISH_FAILOVER_OPUS=${CLAUDISH_FAILOVER_OPUS:-}
      - CLAUDISH_FAILOVER_OPUS_LABEL=${CLAUDISH_FAILOVER_OPUS_LABEL:-}
      - CLAUDISH_FAILOVER_OPUS_DIRECTION=${CLAUDISH_FAILOVER_OPUS_DIRECTION:-}
      - CLAUDISH_FAILOVER_OPUS_NOTE=${CLAUDISH_FAILOVER_OPUS_NOTE:-}
      - CLAUDISH_FAILOVER_OPUS_RESET=${CLAUDISH_FAILOVER_OPUS_RESET:-}
      - CLAUDISH_FAILOVER_SONNET=${CLAUDISH_FAILOVER_SONNET:-}
      - CLAUDISH_FAILOVER_SONNET_LABEL=${CLAUDISH_FAILOVER_SONNET_LABEL:-}
      - CLAUDISH_FAILOVER_SONNET_DIRECTION=${CLAUDISH_FAILOVER_SONNET_DIRECTION:-}
      - CLAUDISH_FAILOVER_SONNET_NOTE=${CLAUDISH_FAILOVER_SONNET_NOTE:-}
      - CLAUDISH_FAILOVER_SONNET_RESET=${CLAUDISH_FAILOVER_SONNET_RESET:-}
      - CLAUDISH_FAILOVER_HAIKU=${CLAUDISH_FAILOVER_HAIKU:-}
      - CLAUDISH_FAILOVER_HAIKU_LABEL=${CLAUDISH_FAILOVER_HAIKU_LABEL:-}
      - CLAUDISH_FAILOVER_HAIKU_DIRECTION=${CLAUDISH_FAILOVER_HAIKU_DIRECTION:-}
      - CLAUDISH_FAILOVER_HAIKU_NOTE=${CLAUDISH_FAILOVER_HAIKU_NOTE:-}
      - CLAUDISH_FAILOVER_HAIKU_RESET=${CLAUDISH_FAILOVER_HAIKU_RESET:-}
      - CLAUDISH_FAILOVER_ROLE_MODELS=${CLAUDISH_FAILOVER_ROLE_MODELS:-}
      - CLAUDISH_FAILOVER_ACTIVE=${CLAUDISH_FAILOVER_ACTIVE:-}
      - CLAUDISH_FAILOVER_AUTO=${CLAUDISH_FAILOVER_AUTO:-}
      # Qwen reasons by default and bills on output. disabled (default) |
      # passthrough | budget:<n>. Re-read per request: flip without a restart.
      - CLAUDISH_QWEN_THINKING=${CLAUDISH_QWEN_THINKING:-}
      # GLM thinking is binary on the coding wire. passthrough (default) |
      # disabled. Re-read per request: flip without a restart.
      - CLAUDISH_GLM_THINKING=${CLAUDISH_GLM_THINKING:-}
    command: ["--port", "3000", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://0.0.0.0:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
