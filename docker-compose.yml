services:
  claudish-proxy:
    build: .
    container_name: claudish-proxy
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Mount config from host (contains API keys, routing, profiles)
      - type: bind
        source: C:\Users\jsboi\.claudish
        target: /root/.claudish
        read_only: true
      # Persistent diagnostic capture: full request/response bodies for offline
      # analysis. The proxy writes req-*.json / resp-*.sse here (gated by
      # CLAUDISH_CAPTURE_DIR). Compacted nightly by ClaudishCaptureCompaction
      # (compress-captures.ps1), then backed up to GDrive.
      - type: bind
        source: D:\claudish-captures
        target: /captures
    environment:
      - NODE_ENV=production
      - CLAUDISH_PROXY_KEY=${CLAUDISH_PROXY_KEY:-}
      - SEARXNG_URL=http://search.myia.io
      - CLAUDISH_CAPTURE_DIR=/captures
      # Sidecar relay (fork extension). All empty → this container is the HUB
      # (po-2023): always local, unchanged. On a sidecar machine, set these in the
      # per-machine .env:
      #   CLAUDISH_RELAY_UPSTREAM — hub URL (LAN http://192.168.0.46:3000, WAN https://models.myia.io)
      #   CLAUDISH_RELAY_COMPRESS — 1 on WAN externals (po-2025, web1) only
      #   CLAUDISH_NO_ANTHROPIC   — 1 on every machine except ai-01 (leak-policy backstop)
      - CLAUDISH_RELAY_UPSTREAM=${CLAUDISH_RELAY_UPSTREAM:-}
      - CLAUDISH_RELAY_COMPRESS=${CLAUDISH_RELAY_COMPRESS:-}
      - CLAUDISH_NO_ANTHROPIC=${CLAUDISH_NO_ANTHROPIC:-}
    command: ["--port", "3000", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://0.0.0.0:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
